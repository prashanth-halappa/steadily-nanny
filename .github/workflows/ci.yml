name: CI

# One job per (app × check), plus shared-types (typecheck + test + lint +
# format), a root scripts/*.test.ts job, and the D1 migrations job.
# 2 apps × 4 checks + 4 shared-types + 1 scripts + 1 db = 14 jobs.
# Each job: checkout → setup-bun → install (frozen) → run the check in the app dir.
# Duplicate/remove a block of four jobs to add/remove an app.

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # API Jobs
  # ============================================
  api-format:
    name: API - Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Check formatting
        run: bun run format:check

  api-lint:
    name: API - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Run lint
        run: bun run lint

  api-test:
    name: API - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Run tests
        # Canonical one-file-per-process runner (mock.module isolation) — see
        # docs/09-TESTING.md. D1-backed tests run on Miniflare (workerd,
        # installed by wrangler), so no database service is needed.
        run: bash scripts/run-tests-one-file.sh tests/unit
        env:
          NODE_ENV: test
      - name: Fetch main for coverage gate diff
        run: git fetch origin main
      - name: Check new source files have tests
        run: BASE_BRANCH=origin/main bash scripts/check-test-coverage-new.sh
        working-directory: .

  api-typecheck:
    name: API - TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: TypeScript Check
        run: bun run typecheck

  # ============================================
  # Mobile Jobs
  # ============================================
  mobile-format:
    name: Mobile - Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Check formatting
        run: bun run format:check

  mobile-lint:
    name: Mobile - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Run lint
        run: bun run lint

  mobile-test:
    name: Mobile - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Run tests
        run: bun run test
        env:
          NODE_ENV: test

  mobile-typecheck:
    name: Mobile - TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: TypeScript Check
        run: bun run typecheck

  # ============================================
  # Shared Types
  # ============================================
  shared-types-typecheck:
    name: Shared Types - TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared-types
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: TypeScript Check
        run: bun run typecheck

  shared-types-test:
    name: Shared Types - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared-types
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Run tests
        run: bun run test
        env:
          NODE_ENV: test

  shared-types-lint:
    name: Shared Types - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared-types
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Run lint
        run: bun run lint

  shared-types-format:
    name: Shared Types - Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared-types
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Check formatting
        run: bun run format:check

  # ============================================
  # Root scripts/*.test.ts — invisible to `turbo run test` since scripts/
  # is not a workspace package (see scripts/run-root-script-tests.sh).
  # ============================================
  scripts-test:
    name: Scripts - Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bash scripts/run-root-script-tests.sh
        env:
          NODE_ENV: test

  # ============================================
  # D1 migrations, EXECUTED rather than grepped: apply every file in
  # apps/api/migrations in order onto an empty local D1 (Miniflare, no
  # Docker), so any broken SQL fails the job. The D1-backed behaviour tests
  # (tests/helpers/testDb.ts) run inside api-test on the same migrations.
  # ============================================
  db-migrations:
    name: DB - D1 migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Apply every migration to a fresh local D1
        run: bun run db:migrate:local
