name: CI

# One job per (app × check). 3 apps × 4 checks = 12 parallel jobs.
# Each job: checkout → setup-bun → install (frozen) → run the check in the app dir.
# Duplicate/remove a block of four jobs to add/remove an app.

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # API Jobs
  # ============================================
  api-format:
    name: API - Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Check formatting
        run: bun run format:check

  api-lint:
    name: API - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Run lint
        run: bun run lint

  api-test:
    name: API - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Run tests
        # Run each test file in its own process (required for mock.module isolation).
        # Use a bash loop instead of xargs to avoid exit code 123 issues on Ubuntu.
        run: |
          set -e
          for f in $(find tests/unit -name '*.test.ts' | sort); do
            bun test "$f"
          done
        env:
          NODE_ENV: test

  api-typecheck:
    name: API - TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: TypeScript Check
        run: bun run typecheck

  # ============================================
  # Web Jobs
  # ============================================
  web-format:
    name: Web - Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Check formatting
        run: bun run format:check

  web-lint:
    name: Web - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Run lint
        run: bun run lint

  web-test:
    name: Web - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
