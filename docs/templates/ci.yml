        working-directory: .
      - name: Run tests
        run: bun run test
        env:
          NODE_ENV: test

  web-typecheck:
    name: Web - TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: TypeScript Check
        run: bun run typecheck

  # ============================================
  # Mobile Jobs
  # ============================================
  mobile-format:
    name: Mobile - Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
