[install]
# Equivalent to .npmrc save-exact=true — pin exact versions, no ^/~ drift
exact = true
# Use hardlink backend for Metro bundler compatibility (Expo/React Native)
backend = "hardlink"
# Use hoisted (npm-style flat) node_modules so Expo's native module
# duplicate-check sees a single copy per package. Bun's default isolated
# linker creates per-consumer hash buckets that expo-doctor flags as
# duplicates even when the version is identical.
linker = "hoisted"

[install.lockfile]
save = true

[test]
# Run test files one at a time. Required for mock.module() isolation:
# mock.module mutates a global registry, so concurrent test files clobber
# each other's mocks.
concurrency = 1
