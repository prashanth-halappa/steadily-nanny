# Builds the API image on Cloud Build instead of locally.
#
# Cloud Run needs linux/amd64; every dev machine here is Apple Silicon, where a
# `docker build --platform linux/amd64` runs `bun install` under emulation and
# takes 20+ minutes. Cloud Build is native amd64 and takes ~2.
#
# Invoked by deploy-cloud-run.sh; the build context is the MONOREPO ROOT.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'apps/api/Dockerfile', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
