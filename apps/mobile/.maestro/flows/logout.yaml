# Sign out to the welcome wall so the next login.yaml / login-nanny.yaml
# can authenticate as a different role on the same simulator.
#
# Assumes an authenticated session (tabs visible). No-op if already on welcome.
appId: com.jetto.steadily.nanny
---
# The notification soft-ask sheet ("Stay in the loop") can pop over any
# signed-in screen once its snoozed state is wiped; it blocks every selector
# under it. Dismiss before touching the tab bar.
- runFlow:
    when:
      visible:
        text: 'Maybe later'
    commands:
      - tapOn:
          text: 'Maybe later'
      - waitForAnimationToEnd

- runFlow:
    when:
      visible:
        id: 'tab-settings'
    commands:
      - tapOn:
          id: 'tab-settings'
      - waitForAnimationToEnd
      - assertVisible:
          id: 'settings-screen'
      - runFlow:
          when:
            visible:
              text: 'Maybe later'
          commands:
            - tapOn:
                text: 'Maybe later'
            - waitForAnimationToEnd
      # 25s, not 10s. `settings-sign-out` is the LAST control on a long
      # settings page (households list → Account → Language → Legal & help →
      # then the button, settings.tsx:516). Caught in the act 2026-08-12: the
      # failure frame showed the page scrolled only as far as "Legal & help",
      # i.e. the scroll was still working when the 10s budget expired. The
      # element is not missing and not gated — it is an unconditional
      # top-level Button — so "Element not found: settings-sign-out" here has
      # always meant "ran out of scrolling time", which is what made this look
      # like a third unfixed gap in the reset path.
      # `centerElement: true` is the load-bearing part, not the timeout.
      # MEASURED 2026-08-12 from a live hierarchy dump at the exact failure:
      # `settings-sign-out` sits at [22,818][380,866] and the TAB BAR occupies
      # [0,791][402,874] — so the button's centre (201,842) is inside the tab
      # bar, and a plain `scrollUntilVisible` stops as soon as the button is in
      # the hierarchy (visibility is hierarchy-based, not occlusion-based),
      # then taps the tab bar instead. Maestro reports both COMPLETED.
      # `centerElement` forces the scroll to continue until the button is
      # centred in the viewport, clear of the tab bar. Safe to centre here
      # precisely because this is the LAST control on the page, so there is
      # nothing to overshoot into.
      #
      # This is 13a's root cause. "Element not found: settings-sign-out" was
      # only the shallower half of it — with more scroll budget the element IS
      # found, and the tap then silently lands on the tab bar instead. The
      # button is unconditional (settings.tsx:516); nothing about it is gated.
      - scrollUntilVisible:
          element:
            id: 'settings-sign-out'
          direction: DOWN
          centerElement: true
          timeout: 25000
      - tapOn:
          id: 'settings-sign-out'
      - extendedWaitUntil:
          visible:
            id: 'welcome-screen'
          timeout: 20000

- waitForAnimationToEnd
