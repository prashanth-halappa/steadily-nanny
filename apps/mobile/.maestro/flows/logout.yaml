# Sign out to the welcome wall so the next login.yaml / login-nanny.yaml
# can authenticate as a different role on the same simulator.
#
# Assumes an authenticated session (tabs visible). No-op if already on welcome.
appId: com.jetto.steadily.nanny
---
# The tab wrapper's testID stopped surfacing to the accessibility tree after
# the Phase 3 tab-layout changes (Maestro sees the icon ids, not `tab-*`).
# Guard + tap on the visible label instead; testID surfacing is a Phase 4
# punch-list item — restore id-based selection when it's fixed.
- runFlow:
    when:
      visible:
        text: 'Settings'
    commands:
      - tapOn:
          text: 'Settings'
      - waitForAnimationToEnd
      - assertVisible:
          id: 'settings-screen'
      - scrollUntilVisible:
          element:
            id: 'settings-sign-out'
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: 'settings-sign-out'
      - extendedWaitUntil:
          visible:
            id: 'welcome-screen'
          timeout: 20000

- waitForAnimationToEnd
