# Sign out to the welcome wall so the next login.yaml / login-nanny.yaml
# can authenticate as a different role on the same simulator.
#
# Assumes an authenticated session. No-op if already on welcome.
#
# WP-C: Settings is no longer a tab — it is a pushed screen reached from the
# `header-settings` gear that every root screen carries. The gear is the
# entry guard now, and it is NOT visible once Settings is already open (that
# screen has a back button instead), so the tap is guarded while the
# `settings-screen` assertion below it is NOT: a caller that pops back to
# Settings from one of its pushed children still gets signed out, and a
# caller standing somewhere with no way in fails loudly instead of silently
# running its next leg as the wrong user (flows 03/06/08's lesson).
appId: com.jetto.steadily.nanny
---
# The notification soft-ask sheet ("Stay in the loop") can pop over any
# signed-in screen once its snoozed state is wiped; it blocks every selector
# under it. Dismiss before touching the header.
- runFlow:
    when:
      visible:
        text: 'Maybe later'
    commands:
      - tapOn:
          text: 'Maybe later'
      - waitForAnimationToEnd

- runFlow:
    when:
      notVisible:
        id: 'welcome-screen'
    commands:
      - runFlow:
          when:
            visible:
              id: 'header-settings'
          commands:
            - tapOn:
                id: 'header-settings'
            - waitForAnimationToEnd
      - assertVisible:
          id: 'settings-screen'
      - runFlow:
          when:
            visible:
              text: 'Maybe later'
          commands:
            - tapOn:
                text: 'Maybe later'
            - waitForAnimationToEnd
      # 25s, not 10s. `settings-sign-out` is the LAST control on a long
      # settings page (households list → Account → Language → Legal & help →
      # then the button). Caught in the act 2026-08-12: the failure frame
      # showed the page scrolled only as far as "Legal & help", i.e. the
      # scroll was still working when the 10s budget expired. The element is
      # not missing and not gated — it is an unconditional top-level Button —
      # so "Element not found: settings-sign-out" here has always meant "ran
      # out of scrolling time".
      # `centerElement: true` is the load-bearing part, not the timeout.
      # MEASURED 2026-08-12 from a live hierarchy dump at the exact failure:
      # `settings-sign-out` sat at [22,818][380,866] and the TAB BAR occupied
      # [0,791][402,874] — so the button's centre (201,842) was inside the tab
      # bar, and a plain `scrollUntilVisible` stops as soon as the button is in
      # the hierarchy (visibility is hierarchy-based, not occlusion-based),
      # then taps the tab bar instead. Maestro reports both COMPLETED.
      # Settings is a pushed screen since WP-C, so there is no tab bar over it
      # any more — `centerElement` stays because it also fixes the plain
      # "stopped scrolling too early" half, and it is safe to centre here
      # precisely because this is the LAST control on the page.
      - scrollUntilVisible:
          element:
            id: 'settings-sign-out'
          direction: DOWN
          centerElement: true
          timeout: 25000
      - tapOn:
          id: 'settings-sign-out'
      - extendedWaitUntil:
          visible:
            id: 'welcome-screen'
          timeout: 20000

- waitForAnimationToEnd
