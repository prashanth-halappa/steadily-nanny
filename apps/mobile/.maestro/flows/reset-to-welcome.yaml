# Converge on the signed-out welcome wall from ANY start state: live session
# (any screen), dev-client launcher, or dead app. The one canonical reset —
# 00-smoke and both login flows run this first.
#
# Never uses clearState: wiping app data re-arms the dev client's one-time
# "This is the developer menu" intro sheet, which then pops ASYNCHRONOUSLY
# over a later flow and swallows every deep link (root cause of two full-suite
# wipeouts, Phase 4). The sheet stays dismissed only while app data persists.
#
# KNOWN GAP (2026-08-11, qa-sonnet): this handles two states — "fully
# onboarded" (tabs visible, sign out below) and "signed out" (welcome-screen,
# no-op) — but not a third: authenticated with no household yet, mid the
# onboarding wizard. That screen has no tab bar and no sign-out reachable
# from here, so a flow that fails partway through onboarding (14, 15) leaves
# the account stuck there, and every later flow's reset-to-welcome then
# fails right here too. Recovery today is manual: `xcrun simctl terminate`
# + `launch` (plain `launchApp` does not force a real process restart), or a
# full `clearState:true` relaunch walking the re-armed intro sheet by hand.
# A real fix would add a third arm here that detects an onboarding screen
# (e.g. `role-screen`/`code-screen`) and recovers via one of those — not
# attempted this session; it is not a one-liner given how many onboarding
# screens can be mid-flight.
appId: com.jetto.steadily.nanny
---
- launchApp:
    clearState: false

# If the intro sheet is up (e.g. first run after a manual reinstall), clear it.
- runFlow:
    when:
      visible:
        text: 'This is the developer menu'
    commands:
      - tapOn:
          text: 'Continue'
      - waitForAnimationToEnd

# Let the relaunched app settle: a live session auto-loads the bundle to the
# tabs; a signed-out one lands on welcome.
- extendedWaitUntil:
    visible:
      id: 'tab-today'
    timeout: 15000
    optional: true
- extendedWaitUntil:
    visible:
      id: 'welcome-screen'
    timeout: 3000
    optional: true

# Only if NEITHER appears are we in the dev-client launcher (or the app died)
# — and only then is it safe to force a bundle load via the
# expo-development-client URL. Forcing it unconditionally reloads mid-mount
# and crashes Fabric (ExpoFabricView.injectInitializer assert).
- runFlow:
    when:
      notVisible:
        id: 'welcome-screen'
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'tab-today'
          commands:
            # The intro sheet pops SECONDS after the launcher renders, and
            # while it is up the dev-client URL is swallowed — so give it a
            # bounded window to appear and clear it BEFORE the bundle load.
            - extendedWaitUntil:
                visible:
                  text: 'This is the developer menu'
                timeout: 6000
                optional: true
            - runFlow:
                when:
                  visible:
                    text: 'This is the developer menu'
                commands:
                  - tapOn:
                      text: 'Continue'
                  - waitForAnimationToEnd
            - openLink: steadilynanny://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
            - waitForAnimationToEnd
            # First custom-scheme open after a REINSTALL raises the iOS
            # system alert `Open in "Steadily Nanny"?`, which stacks ON TOP of
            # the re-armed dev-menu intro sheet. It is not that sheet and
            # nothing else here clears it; while it is up the deep link has
            # not been followed at all, so the bundle never loads and the run
            # dies on a missing welcome-screen. Like the intro sheet it is
            # async, so it needs its own bounded window rather than a bare
            # guard — checked too early, it simply is not there yet.
            # ANCHORED. Maestro text selectors match as a SUBSTRING, so a
            # bare `Open` also matches this alert's own title
            # (`Open in "Steadily Nanny"?`) — and the title comes first, so
            # the tap lands on a label and the alert never closes.
            - extendedWaitUntil:
                visible:
                  text: '^Open$'
                timeout: 8000
                optional: true
            - runFlow:
                when:
                  visible:
                    text: '^Open$'
                commands:
                  - tapOn:
                      text: '^Open$'
                  - waitForAnimationToEnd
            # The intro sheet RE-ARMS after the bundle load on a fresh
            # install and pops again once the JS is up, so this second pass
            # needs its own bounded window exactly like the first — a bare
            # guard evaluates while the bundle is still loading and sees
            # nothing.
            - extendedWaitUntil:
                visible:
                  text: 'This is the developer menu'
                timeout: 20000
                optional: true
            - runFlow:
                when:
                  visible:
                    text: 'This is the developer menu'
                commands:
                  - tapOn:
                      text: 'Continue'
                  - waitForAnimationToEnd
            - extendedWaitUntil:
                visible:
                  id: 'tab-today'
                timeout: 25000
                optional: true
            - extendedWaitUntil:
                visible:
                  id: 'welcome-screen'
                timeout: 5000
                optional: true

# Live session → sign out via the Settings tab. Signed-out edge: the
# (private) deep link redirects to welcome and logout.yaml no-ops.
- runFlow:
    when:
      notVisible:
        id: 'welcome-screen'
    commands:
      - openLink: steadilynanny:///(private)/(tabs)/settings
      - waitForAnimationToEnd
      # Notification soft-ask sheet may be covering the tab bar — logout.yaml
      # also guards on it, but its own guard needs the tab bar visible.
      - runFlow:
          when:
            visible:
              text: 'Maybe later'
          commands:
            - tapOn:
                text: 'Maybe later'
            - waitForAnimationToEnd
      - runFlow: logout.yaml
      - extendedWaitUntil:
          visible:
            id: 'welcome-screen'
          timeout: 15000

- assertVisible:
    id: 'welcome-screen'
