# Dismiss the Expo dev-client menu overlay. ONE tap on its own close button.
#
# CORRECTED 2026-08-12 (Phase 6), with a live hierarchy dump — the previous
# version of this file was built on two wrong premises and reliably failed:
#
#  WRONG: "the dev menu is TWO stacked sheets; Continue advances to the second".
#  ACTUAL: it is ONE sheet whose body is a paged scroll container holding BOTH
#  pages AT THE SAME TIME. A single `maestro hierarchy` while it is up returns
#  the intro page (`dev-tools` image, "This is the developer menu...",
#  `Continue`) AND the menu page (`Reload`, `Go home`, `TOOLS`, ...) as sibling
#  subtrees under the same card, each with its own scroll bar ("2 pages" and
#  "3 pages"). So `when: visible: text: 'Go home'` was ALREADY true before
#  anything was tapped — the old inner conditional proved nothing.
#
#  WRONG: "no accessibility label or text exists on the close control, so it
#  must be tapped by screen geometry (`point: '90%,48%'`)".
#  ACTUAL: the header carries `accessibilityText=Close; resource-id=xmark` at
#  [344,401][378,436]. It is directly selectable. The geometry dependency and
#  its whole device-calibration caveat are gone.
#
#  And `tapOn: text: 'Continue'` is a NO-OP here: Maestro reports the tap
#  COMPLETED and the sheet does not change at all (probed twice — the intro
#  page was still up, pixel-identical, with the app correctly on the welcome
#  screen behind it). That COMPLETED-but-no-effect report is why the failure
#  looked like a wedged app rather than a missed tap.
#
# Why this matters beyond one tap: while the sheet is up it REPLACES the whole
# a11y tree — a dump returns only the sheet and the status bar, nothing of the
# app. So every `visible:`/`notVisible:` guard in reset-to-welcome.yaml reads
# wrong, and its launcher-recovery arm can wrongly conclude the app is dead and
# force a bundle reload mid-mount.
#
# `Runtime version` is the sheet's header subtitle, present on BOTH pages and
# on no app screen — one guard that matches the sheet in either state.
appId: com.jetto.steadily.nanny
---
# NO GUARD. An `optional` tap is already a no-op when the sheet is absent, and
# the guard was the unreliable half: measured 2026-08-12, `tapOn: id: xmark`
# dismisses the sheet 100% of the time in isolation, while
# `when: visible: text: 'Runtime version'` repeatedly evaluated FALSE with the
# sheet plainly on screen — so the dismiss never ran and every later assertion
# read through a covered screen. Dropping the conditional removes the failure
# mode instead of tuning around it.
#
# `xmark` is the dev-client sheet's own close control
# (accessibilityText=Close). No app screen renders that resource-id.
- tapOn:
    id: 'xmark'
    optional: true
- waitForAnimationToEnd
