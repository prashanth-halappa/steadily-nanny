# Point the app at a specific household, and clear the notification soft-ask
# on the way past. Callers pass HOUSEHOLD_ID.
#
# WHY THIS EXISTS — the active household is CLIENT-side state that survives
# sign-out/sign-in on the same simulator, and the seed parent owns THREE live
# households (two both named "Our household", plus "PHASE4 Sunday household"
# which `seed-phase4-fixtures.ts` creates). A flow that just logs in reads
# whichever household the app happened to have selected last: flow 07 opened
# the Sunday household's pay hub — which already HAS an arrangement, so
# `PaySetupScreen` redirected straight back out — instead of the setup form it
# is about. Nothing in the flow said "Sunday household"; that is exactly what
# makes it worth an explicit step rather than a comment.
#
# Also the reliable place to clear the "Stay in the loop" soft-ask: it is
# ASYNC, so login.yaml's bounded window can miss it and it then pops over a
# later screen and hides the whole a11y tree beneath it (seen on flow 07).
#
# Safe to call unconditionally — `HouseholdSwitcher` renders null for a user
# with a single household, and the guard below makes that a no-op.
appId: com.jetto.steadily.nanny
---
# The soft-ask FIRST, and on its own bounded window: while it is up it hides
# the whole hierarchy underneath, tab bar included, so tapping `tab-settings`
# before clearing it fails with "Element not found" on a tab that is plainly
# there.
- extendedWaitUntil:
    visible:
      text: 'Maybe later'
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible:
        text: 'Maybe later'
    commands:
      - tapOn:
          text: 'Maybe later'
      - waitForAnimationToEnd
# Guarded, not a bare tapOn: a freshly-onboarding user (no household yet,
# still in the wizard) has no tab bar at all, so 'tab-settings' does not
# exist — confirmed root cause of flow 14's "Element not found: tab-settings"
# (2026-08-12). The header's "safe to call unconditionally" claim only
# accounted for HouseholdSwitcher rendering null; it did not account for the
# tab bar itself being absent pre-onboarding-completion.
#
# `extendedWaitUntil` (optional, bounded) BEFORE every `when: visible` guard
# below — 2026-08-16: a bare `when: visible:` is a single instantaneous poll,
# not a wait, and right after sign-in / a tab switch the tab bar or the sheet
# trigger can still be a frame or two from mounting. That one false negative
# makes the ENTIRE guarded block a silent no-op — no assertion fails, the
# flow just carries on with whatever household was already active.
# Root-caused via flow 07's `commands-*.json`: the outer guard's
# `runFlowCommand` came back `SKIPPED` (tab-settings genuinely not yet
# visible at that instant), so the flow never switched off the household a
# PRIOR run had left active, and that household's pre-existing pay
# arrangement made `PaySetupScreen`'s own (unrelated, pre-existing)
# redirect-when-arrangement-exists behaviour bounce the flow before it typed
# anything — read as an app defect, it was this race. Confirmed the same
# stale-household symptom stranding a nanny login flow via a standalone
# diagnostic run (Sunday household, not `PHASE4_HOUSEHOLD_ID`, was still on
# screen after `login-nanny.yaml` + a tap on Today).
- extendedWaitUntil:
    visible:
      id: 'tab-settings'
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible:
        id: 'tab-settings'
    commands:
      - tapOn:
          id: 'tab-settings'
      - waitForAnimationToEnd
      # It can also arrive AFTER the tab switch — same sheet, different moment.
      - runFlow:
          when:
            visible:
              text: 'Maybe later'
          commands:
            - tapOn:
                text: 'Maybe later'
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: 'household-switcher-trigger'
          timeout: 4000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'household-switcher-trigger'
          commands:
            - tapOn:
                id: 'household-switcher-trigger'
            - waitForAnimationToEnd
            - assertVisible:
                id: 'household-switcher-sheet'
            - tapOn:
                id: 'household-switcher-option-${HOUSEHOLD_ID}'
            - waitForAnimationToEnd
            - assertNotVisible:
                id: 'household-switcher-sheet'
