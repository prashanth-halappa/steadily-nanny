# Recovery arm for reset-to-welcome.yaml ONLY: authenticated mid-onboarding with
# no tab bar and no in-app sign-out on the current wizard screen. Flows 14/15
# leave accounts here when they fail partway.
#
# clearState is acceptable here and nowhere else in reset-to-welcome: it only
# fires in this stuck state, and the alternative is a manual simctl terminate +
# relaunch. It re-arms the dev client's one-time intro sheet — walked below
# with the same bounded-window pattern as the launcher arm in
# reset-to-welcome.yaml.
#
# clearState WIPES the app container, including the
# `EXDevMenuIsOnboardingFinished` preference the driver sets to suppress that
# sheet in the first place — so this file is the one place in the suite where
# the sheet genuinely re-arms mid-run, and the dismiss calls below are the
# real fallback rather than belt-and-braces. They used to inline
# `tapOn: text: 'Continue'`, which is a NO-OP on that sheet; both now call the
# shared dismiss-dev-menu.yaml, which taps the sheet's own close control.
appId: com.jetto.steadily.nanny
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: 'Runtime version'
    timeout: 6000
    optional: true
- runFlow: dismiss-dev-menu.yaml
- openLink: steadilynanny://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: '^Open$'
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        text: '^Open$'
    commands:
      - tapOn:
          text: '^Open$'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: 'Runtime version'
    timeout: 20000
    optional: true
- runFlow: dismiss-dev-menu.yaml
- extendedWaitUntil:
    visible:
      id: 'welcome-screen'
    timeout: 25000
