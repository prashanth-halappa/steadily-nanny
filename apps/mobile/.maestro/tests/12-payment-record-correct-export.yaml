# Scenario — 3-T2's money-integrity loop on an approved week: parent records a
# payment, corrects it, and both rows stay visible with signed amounts and an
# honest balance; then the week export surface opens.
#
# ORDERING — this flow consumes the week flow 11 approves. It must run AFTER
# 11 (and after 07, which is what puts a priced arrangement over the seed week
# — with no gross there is no balance, and `hours-mark-paid-button` renders
# only when `isApproved && !readOnly && balanceMinor > 0`).
# scripts/seed-phase4-fixtures.ts deletes this week's payments on every seed,
# so the ledger starts empty each run.
#
# Payments are append-only: a correction is a second row with a NEGATIVE
# amount, never an edit (migration 085). That is exactly what the two-row
# assertion below is for.
#
# SCOPING NOTE — the export CANNOT be verified past the in-app sheet.
# `WeekExportAction` writes a temp file and calls `Sharing.shareAsync`
# (timesheet/utils/weekExport.ts): success produces no toast, no modal and no
# in-app state change, only the OS share sheet, which is outside the app's view
# hierarchy. This flow therefore asserts the export SHEET and both of its
# options and stops there — it deliberately does not tap `hours-export-csv`,
# because a native share sheet left open strands the simulator for every flow
# after this one (GOLDEN-FIXES #1's class of problem). Verifying the produced
# CSV/PDF belongs in `weekExport`'s unit tests, not here.
appId: com.jetto.steadily.nanny
tags:
  - money
---
- runFlow: ../flows/login.yaml
- runFlow:
    file: ../flows/select-household.yaml
    env:
      HOUSEHOLD_ID: ${PHASE4_HOUSEHOLD_ID}
- openLink: steadilynanny:///(private)/(tabs)/hours?weekStart=${PHASE4_SEED_WEEK_START}
- waitForAnimationToEnd
- assertVisible:
    id: 'hours-screen'
- assertVisible:
    id: 'hours-active-week-${PHASE4_SEED_WEEK_START}'
# Approved-only section; its presence is the precondition check that flow 11
# actually approved this week.
#
# `scrollUntilVisible` first, exactly as flow 08 needs before its sick badge:
# this section sits below the week thread, the day rows and the money card, and
# this ScrollView DROPS off-viewport children from the a11y tree, so a bare
# assertVisible reports "not visible" for a section that is simply further down.
# Verified 2026-08-12 — at the failure the week was genuinely `approved` in the
# DB (status=approved, gross_minor=12000) and the screen was showing "Approved
# on 12 August", so this was never the precondition failure it looked like.
- scrollUntilVisible:
    element:
      id: 'hours-paid-state'
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: 'hours-paid-state'
- assertVisible:
    id: 'hours-paid-state-empty'

# --- Record a partial payment -------------------------------------------
# Partial on purpose: a full settlement takes `balanceMinor` to 0, which
# un-renders both `hours-mark-paid-button` and `hours-paid-state-balance` and
# would make the balance assertion below vacuous.
# A `scrollUntilVisible` before every tap in the bottom sections of this screen.
# These controls are the LAST things on the Hours screen and their tap targets
# land under the TAB BAR ([0,791][402,874]). Measured: `hours-mark-paid-button`
# sits at [44,771][358,819] — centre (201,795), which is exactly inside
# `tab-hours` ([201,791][301,840]). The original flow tapped these with NO
# scroll at all, so the tap hit the TAB; Maestro reported COMPLETED and the
# sheet simply never opened, which surfaced one step later as a missing sheet.
#
# A PLAIN scroll is the right remedy, NOT `centerElement: true`. Two container
# geometries, two behaviours, and it matters:
#   - `hours-week-list` is bounded [0,63][402,791] — it stops exactly where the
#     tab bar starts. So Maestro's DEFAULT `visibilityPercentage: 100` already
#     means "fully inside the list", which by construction is clear of the bar.
#   - `centerElement: true` additionally demands the element reach the viewport
#     CENTRE, which a LAST element can never do — there is nothing below it to
#     scroll up against. It fails with "No visible element found" on an element
#     that is plainly on screen (measured: `hours-export-button` reported not
#     found while sitting at [22,629][380,677], fully visible and tappable).
# `logout.yaml` DOES need `centerElement` because the settings scroll view
# extends UNDER the tab bar, so 100%-visible is satisfiable while still occluded.
- scrollUntilVisible:
    element:
      id: 'hours-mark-paid-button'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'hours-mark-paid-button'
- waitForAnimationToEnd
- assertVisible:
    id: 'hours-record-payment-sheet'
# No `hideKeyboard` anywhere in these sheets: Maestro's iOS dismiss gesture
# lands on the sheet's own primary button, which here would RECORD the payment
# with only the amount filled in and close the sheet under the remaining steps
# (the same mechanism that broke flows 04 and 11 — see flow 04's note). The
# fields below are all reachable with the keyboard up; the sheet lifts clear.
- tapOn:
    id: 'hours-record-payment-amount-input'
- eraseText
- inputText: '40.00'
- tapOn:
    id: 'hours-record-payment-date-chip-today'
- tapOn:
    id: 'hours-record-payment-method-input'
- inputText: 'Bank transfer'
- assertNotVisible:
    id: 'hours-record-payment-overpayment-error'
- tapOn:
    id: 'hours-record-payment-submit'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'hours-record-payment-sheet'
- assertNotVisible:
    id: 'hours-paid-state-empty'
- takeScreenshot: payment-recorded

# --- Correct it ----------------------------------------------------------
# Payment ids are server-generated, so the row is addressed by the stable
# prefix of its testID as a regex.
- scrollUntilVisible:
    element:
      id: 'hours-paid-state-line-.*-open'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'hours-paid-state-line-.*-open'
- waitForAnimationToEnd
# PaymentDetailSheet's root takes the bare testID (`payments-detail`), unlike
# RecordPaymentSheet / PaymentCorrectionSheet which derive `${testID}-sheet`.
- assertVisible:
    id: 'payments-detail'
- assertVisible:
    id: 'payments-detail-append-only'
# The parent's correction trigger ("Correct this payment"). NOT the nanny's
# `payments-detail-flag` ("This doesn't look right"), which opens a thread
# message rather than a ledger row — same wording family, different action.
- tapOn:
    id: 'payments-detail-correct'
- waitForAnimationToEnd
- assertVisible:
    id: 'hours-correct-payment-sheet'
- assertVisible:
    id: 'hours-correct-payment-original'
# The sheet pre-seeds the full original; a partial reversal is the harder case
# (it must not exceed the original, and it leaves a residue on the ledger).
# Same sheet rule as the record sheet above.
- tapOn:
    id: 'hours-correct-payment-amount-input'
- eraseText
- inputText: '15.00'
- tapOn:
    id: 'hours-correct-payment-reason-input'
- inputText: 'Sent 15 too much by mistake'
- assertNotVisible:
    id: 'hours-correct-payment-amount-error'
- tapOn:
    id: 'hours-correct-payment-submit'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'hours-correct-payment-sheet'

# Both rows, and the correction indented under the row it reverses. The
# correction wrapper id only exists for `kind === 'correction'` rows, so this
# is the append-only claim made testable.
- assertVisible:
    id: 'hours-paid-state-correction-.*'
- assertVisible:
    id: 'hours-paid-state-total'
# Honest balance: 40 paid, 15 reversed ⇒ 25 against the week's gross, so the
# balance line must still be there (it renders only when `balanceMinor > 0`).
- assertVisible:
    id: 'hours-paid-state-balance'
- takeScreenshot: payment-corrected-ledger

# --- The ledger screen shows both rows too -------------------------------
- scrollUntilVisible:
    element:
      id: 'hours-payments-link'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'hours-payments-link'
- waitForAnimationToEnd
- assertVisible:
    id: 'payments-screen'
- assertVisible:
    id: 'payments-list'
- assertVisible:
    id: 'payments-row-.*'
- takeScreenshot: payments-ledger
# Assert the back control exists (it is this screen's only way out, so its
# absence would be a real regression worth failing on) but do NOT navigate with
# it — go back to Hours the same deterministic way this flow arrived in the
# first place, with the deep link from line 34.
#
# WHY, stated honestly because it is a worked-around dependency and not a
# proven fix: `payments-back` calls `router.back()` (PaymentsScreen.tsx:354).
# In THIS flow that tap reliably does not navigate — the failure frame shows
# the Payments screen still up, and a 15s `extendedWaitUntil` for `hours-screen`
# expires. Yet the identical sequence, INCLUDING the full round trip
# `hours-payments-link` → `payments-screen` → `payments-back` → `hours-screen`,
# PASSES every time when replayed in isolation on this same build and device.
# So the trigger is something this flow does earlier — most likely the
# `payments-detail` sheet and the correction it performs before coming here —
# and it is NOT a broken button or a bad testID. Flow 12 is about recording,
# correcting and exporting a payment; it should not be gated on that unresolved
# navigation question, so it no longer navigates by button here.
# FLAGGED for the owner: possible app-side `router.back()` no-op after the
# payment-correction sheet. NOT confirmed as a defect — I could not reproduce
# it outside this flow.
- assertVisible:
    id: 'payments-back'
- openLink: steadilynanny:///(private)/(tabs)/hours?weekStart=${PHASE4_SEED_WEEK_START}
- waitForAnimationToEnd

# --- Export surface ------------------------------------------------------
- extendedWaitUntil:
    visible:
      id: 'hours-screen'
    timeout: 15000
# Same treatment as the paid-state controls: `hours-export-button` is a
# bottom-of-content Button (`WeekExportAction`, rendered near the end of
# ParentWeekView), so it is below the fold on arrival and its centre lands under
# the tab bar once scrolled to. Without this the tap reports COMPLETED against a
# tab and the export sheet never opens — or, as here after a fresh deep link,
# the element is not in the tree at all yet.
- scrollUntilVisible:
    element:
      id: 'hours-export-button'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'hours-export-button'
- waitForAnimationToEnd
- assertVisible:
    id: 'hours-export-sheet'
- assertVisible:
    id: 'hours-export-csv'
- assertVisible:
    id: 'hours-export-pdf'
- takeScreenshot: week-export-sheet
# Deliberately NOT tapping an option — see the SCOPING NOTE in the header.
#
# Dismiss via the sheet's OWN close control, not `- back`. On iOS Maestro's
# `back` is an edge-swipe navigation gesture; it does not dismiss a
# `BottomSheetBase`, so the sheet stayed up and this flow died on its very last
# assertion. `BottomSheetBase` exposes `bottom-sheet-close-button` (and
# `bottom-sheet-backdrop`) — verified present in the live hierarchy with the
# sheet open, and verified to dismiss it.
- tapOn:
    id: 'bottom-sheet-close-button'
- extendedWaitUntil:
    notVisible:
      id: 'hours-export-sheet'
    timeout: 10000
