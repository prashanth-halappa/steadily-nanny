# [audit-2026-08-17] Targets E (two-block week: accepting a usual week whose
# Monday has two blocks shows two Monday shifts) and F/S11 (Schedule tab's
# "Your usual week" entry -> NannyUsualWeekScreen renders the accepted
# pattern).
#
# Fixture (this run, direct SQL): a `pending` schedule_pattern in household A
# ("Our household"), dtstart = 2026-08-17 (this Monday), Mon/Tue/Wed/Thu/Fri,
# with MONDAY split into two blocks (07:00-13:00 and 15:00-18:00) exercising
# migration 101's multi-block-per-weekday support. Accessed directly by
# pattern id (not the Today CTA) because `today-pending-schedule-card` /
# `today-pending-schedule-cta` are NOT unique testIDs when a nanny has more
# than one pending pattern at once (see the validation report's product
# findings — she does, here, because of the household-B fixture in flow 22).
appId: com.jetto.steadily.nanny
tags:
  - audit-2026-08-17
---
- runFlow: ../flows/login-nanny.yaml

- openLink: steadilynanny:///(private)/schedule/respond/d8eeac9d-146b-4130-8486-6ae4ba131523
- waitForAnimationToEnd
- assertVisible:
    id: 'schedule-respond-screen'
- scrollUntilVisible:
    element:
      id: 'schedule-respond-accept'
    direction: DOWN
    timeout: 10000
- takeScreenshot: 25-e-respond-screen-two-blocks
- tapOn:
    id: 'schedule-respond-accept'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'schedule-respond-accept'
    timeout: 15000
- assertVisible:
    id: 'schedule-respond-accept'
    enabled: false
- takeScreenshot: 25-e-accepted

# === E: the agenda shows TWO Monday shifts (07:00-13:00, 15:00-18:00) =====
- tapOn:
    id: 'tab-schedule'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'schedule-shifts-screen'
    timeout: 15000
- assertVisible:
    text: '7:00 AM'
- assertVisible:
    text: '3:00 PM'
- takeScreenshot: 25-e-agenda-two-monday-shifts

# === F/S11: Schedule tab's "Your usual week" -> NannyUsualWeekScreen ======
- scrollUntilVisible:
    element:
      id: 'schedule-shifts-usual-week-link'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'schedule-shifts-usual-week-link'
- waitForAnimationToEnd
- assertVisible:
    id: 'nanny-usual-week-screen'
- assertVisible:
    id: 'nanny-usual-week-status'
- assertVisible:
    id: 'nanny-usual-week-preview'
- takeScreenshot: 25-f-nanny-usual-week-screen
