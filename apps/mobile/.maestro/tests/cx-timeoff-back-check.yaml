# One-off hand-verification (CX close-out, WP-N) — TimeOffScreen's back
# button after WP-C moved Settings out of the tab group (pushed screen behind
# `header-settings`, with its own `settings-back`). Confirms `time-off-back`
# (`TimeOffScreen.tsx`'s `router.back()`) actually pops back to Settings
# rather than stranding the user on Time off.
#
# Nanny login: `settings-request-time-off` renders only in Settings' nanny
# branch (and only with an active membership), so a parent never sees it.
appId: com.jetto.steadily.nanny
tags:
  - settings
  - timeoff
---
- runFlow: ../flows/login-nanny.yaml
- tapOn:
    id: 'header-settings'
- waitForAnimationToEnd
- assertVisible:
    id: 'settings-screen'
- tapOn:
    id: 'settings-request-time-off'
- waitForAnimationToEnd
- assertVisible:
    id: 'time-off-screen'
- hideKeyboard:
    optional: true # Maestro 2.12 + iOS 26 throws when it cannot dismiss; was a silent no-op
- tapOn:
    id: 'time-off-back'
- waitForAnimationToEnd
- assertVisible:
    id: 'settings-screen'
- assertNotVisible:
    id: 'time-off-screen'
- takeScreenshot: cx-timeoff-back-ok
