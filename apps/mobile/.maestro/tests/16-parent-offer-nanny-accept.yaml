# Scenario — P8 + B1, driven fully live end to end: a fresh parent signs in,
# builds her own household through the wizard (HouseholdScreen ->
# ChildrenScreen), and on the wizard's INVITE step attaches a pay OFFER to a
# nanny invite (`PayChangeSheet` in `mode="offer"` — no new wizard step, the
# same step just grew a card). A fresh nanny signs in, joins via the code
# (wizard JOIN path), and the offer is promoted server-side into a
# `direction: 'parent'` terms_proposals row
# (`householdCommandService.promoteOfferToProposal`). She reviews it from her
# inbox and ACCEPTS behind the D-7 responsibility checkbox — this is B1's
# fix: before it, every carer-side accept 404'd because the server always
# treated the answering side as the parent, regardless of `direction`. The
# arrangement is then live and visible on both sides.
#
# FIXTURES — `PHASE4_OFFER_PARENT_EMAIL` / `PHASE4_OFFER_NANNY_EMAIL`, two
# fresh CONFIRMED accounts with no household
# (`scripts/seed-phase4-fixtures.ts`, point 9). Both accounts and the
# household/invite/offer they build are minted here, live, not seeded —
# there was no route blocker on the PARENT side the way flow 14's nanny half
# has one (see that flow's header), so there is nothing to fall back to SQL
# for.
# STATUS 2026-08-15 — GREEN. The earlier stall on `invite-generate-button` was
# a Maestro artifact (the occlusion class), NOT a product bug. Root cause:
# the button's unscrolled a11y frame was [22,814][380,862] — fully inside the
# 874pt screen, so `scrollUntilVisible` (frame-based, occlusion-blind) never
# scrolled and `assertVisible` passed — while its pixels were clipped behind
# the pinned footer; every tap landed at (201,838), the footer's dead padding
# below the CTA. (The y592-640 bounds previously cited here came from a
# hierarchy read after a manual/centered scroll, not the tap-time frame —
# maestro.log records [22,814][380,862] at every actual tap.) Fixed with a
# real `scroll` swipe before the tap; a user who scrolls the button into view
# taps it normally, which this flow now proves end to end.
#
# Driving past the stall surfaced one REAL product bug (fixed, D56): the
# post-accept redirect sent the CARER to `/settings/pay` — the parent-only
# management surface, which gates her to `pay-not-available` — instead of her
# own `/settings/my-pay`. It also exposed a flow gap the stall had masked:
# the NANNY x JOIN wizard inserts an AVAILABILITY step flow 14's parent
# joiner never sees.
#
# THE FEATURE ITSELF IS ALSO VERIFIED server-side, independently of this flow,
# straight through the API against the local stack: offer attaches to the
# invite, is absent from the public preview, promotes on redeem into a
# `direction: 'parent'` proposal carrying `from_invite_id`, the CARER accepts
# it (B1 — this 404'd before the fix), and the resulting `pay_arrangements`
# row is written under the AUTHORING PARENT's identity, not hers (§17 held).
# See the session's `verify-p8-b1.ts`.
appId: com.jetto.steadily.nanny
tags:
  - pay
  - onboarding
---
# --- Parent: build a household from nothing, then invite with an offer ----
- runFlow:
    file: ../flows/login-no-household.yaml
    env:
      PARENT_EMAIL: ${PHASE4_OFFER_PARENT_EMAIL}
      PARENT_PASSWORD: ${PHASE4_TEST_PASSWORD}

- extendedWaitUntil:
    visible:
      id: 'role-screen'
    timeout: 25000
- tapOn:
    id: 'role-parent'
- tapOn:
    id: 'role-screen-cta'
- waitForAnimationToEnd

- assertVisible:
    id: 'start-screen'
- tapOn:
    id: 'start-create'
- tapOn:
    id: 'start-screen-cta'
- waitForAnimationToEnd

- assertVisible:
    id: 'household-screen'
- tapOn:
    id: 'parent-name-input'
- eraseText
- inputText: 'Phase4 Offer Parent'
# `hideKeyboard`/a bare next-field tap are both unreliable here — occlusion
# class, confirmed twice on this screen: first the CTA reported COMPLETED
# while still on household-screen with the keyboard up; then, even after
# dismissing before the CTA, `household-name-input` sits right on the
# keyboard's boundary (y=523-569 vs keyboard top ~566) so the tap never
# focused it — both strings landed in `parent-name-input` (with a stray
# QuickType word spliced in) and the CTA stayed correctly disabled. Dismiss
# BETWEEN fields too, not just before the CTA.
- tapOn:
    text: 'Name your family'
- waitForAnimationToEnd
# Phone is now a required field on this step (099/contact-fields — S8) —
# `HouseholdScreen.onContinue` early-returns with `phoneError: 'required'`
# and never calls `advance()` when it's blank, so a blank phone leaves the
# flow stuck on `household-screen` until the next hard wait times out
# (measured 2026-08-16: `children-screen` timeout after 15s). Any 5+ digit
# string satisfies `PhoneNumberSchema` (loose by design — see its module doc).
- tapOn:
    id: 'phone-input'
- inputText: '5551234567'
- tapOn:
    text: 'Name your family'
- waitForAnimationToEnd
- tapOn:
    id: 'household-name-input'
- eraseText
- inputText: 'Phase4 Offer Household'
- tapOn:
    text: 'Name your family'
- waitForAnimationToEnd
# Converts a silent no-op tap into an immediate, obvious failure instead of a
# 15s timeout on the next screen.
- assertVisible:
    id: 'household-screen-cta'
    enabled: true
- tapOn:
    id: 'household-screen-cta'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'children-screen'
    timeout: 15000
- tapOn:
    id: 'children-add-button'
- waitForAnimationToEnd
- assertVisible:
    id: 'child-form-sheet'
- tapOn:
    id: 'child-form-name'
- inputText: 'Phase4 Kid'
- tapOn:
    id: 'child-form-age'
- inputText: '5'
- hideKeyboard
- tapOn:
    id: 'child-form-submit'
- waitForAnimationToEnd
- tapOn:
    id: 'children-screen-cta'
- waitForAnimationToEnd

- assertVisible:
    id: 'invite-screen'
# Default role is already NANNY; the tap is explicit, not load-bearing.
- tapOn:
    id: 'invite-role-nanny'
- tapOn:
    id: 'invite-offer-add-button'
- waitForAnimationToEnd
- assertVisible:
    id: 'pay-offer-sheet'
- tapOn:
    id: 'pay-offer-rate-input'
- inputText: '22.50'
# Occlusion class, one level deeper than the scroll fix: the numeric pad
# covers `pay-offer-rate-input` itself once it opens, so the typed text can
# silently miss the field. Assert it landed before doing anything else — a
# missing rate makes `buildCreatePayArrangementRequest` return null, which
# correctly disables Submit and was previously misread as a scroll/tap miss.
- assertVisible:
    id: 'pay-offer-rate-input'
    text: '22.50'
# `hideKeyboard` doesn't reliably dismiss inside a BottomSheetBase either
# (occlusion class, confirmed: `pay-offer-submit` — last of eight collapsible
# groups down a long scrollable sheet — was unreachable because the keyboard
# was still up). Dismiss on a non-interactive label instead.
- tapOn:
    text: 'Hourly rate'
- waitForAnimationToEnd
- tapOn:
    id: 'pay-offer-cancellation-chip-none'
- scrollUntilVisible:
    element:
      id: 'pay-offer-submit'
    direction: DOWN
    timeout: 10000
# Occlusion class, third layer: scrolling to the note field re-focuses it and
# summons the keyboard AGAIN, right back over `pay-offer-submit` at the
# bottom of the sheet. "Note (optional)" is the note INPUT's placeholder, not
# a label — tapping it re-focuses the field and raises the keyboard rather
# than dismissing it (confirmed: the next assert failed on this exact
# mistake). "How often you pay" is a genuinely non-interactive section
# heading (`PayScheduleFields.tsx`, a plain `<Small>`) in view at this scroll
# position — use that instead.
- tapOn:
    text: 'How often you pay'
- waitForAnimationToEnd
# Prove the keyboard is actually down rather than assuming it — `Dictate`
# only exists in the tree while the iOS keyboard is on screen.
- assertNotVisible:
    text: 'Dictate'
# Occlusion class, FOURTH layer: dismissing the keyboard reflows the sheet —
# it regains the ~300pt the keyboard occupied — so the scroll offset that had
# `pay-offer-submit` in view is stale the moment the keyboard goes. Scroll
# AGAIN now that the layout is final. Order matters: scroll, dismiss, THEN
# re-scroll; dismissing first doesn't work because the dismissal target has to
# already be on screen to tap.
- scrollUntilVisible:
    element:
      id: 'pay-offer-submit'
    direction: DOWN
    timeout: 10000
# Converts "the app correctly refused an incomplete offer" into an immediate,
# obvious failure right here instead of a confusing miss two screens later.
- assertVisible:
    id: 'pay-offer-submit'
    enabled: true
- tapOn:
    id: 'pay-offer-submit'
- waitForAnimationToEnd
# Assert the IMMEDIATE effect of the tap, not the downstream one — a COMPLETED
# tap proves nothing about what was physically under it (the occlusion class).
# If the sheet is still open, the submit didn't take. `waitForAnimationToEnd`
# is not reliable for `BottomSheetBase`'s own close animation (same component
# `- back` already doesn't dismiss, per the harness notes) — a bounded wait
# instead of a bare assert, so this doesn't race the dismissal.
- extendedWaitUntil:
    notVisible:
      id: 'pay-offer-sheet'
    timeout: 8000
- assertVisible:
    id: 'invite-offer-summary'
# The occlusion class, one more shape: with the P8 offer summary on screen,
# `invite-generate-button`'s UNSCROLLED a11y frame is [22,814][380,862] —
# fully inside the 874pt screen — so `scrollUntilVisible` (frame-based,
# occlusion-blind) NO-OPS and `assertVisible` passes, while the pixels are
# clipped behind the pinned footer (CTA y760-808 + its pb-8/safe-area down to
# y874). Every tap went to (201,838), the footer's dead padding BELOW the
# CTA, and reported COMPLETED (maestro.log, all 2026-08-15 runs). A real
# `scroll` swipe moves the ScrollView to its bottom, landing the button at
# ~y584-632 — genuinely clear of the footer — so the id-tap's refreshed
# frame meets real pixels.
- scroll
- waitForAnimationToEnd
- assertVisible:
    id: 'invite-generate-button'
    enabled: true
- tapOn:
    id: 'invite-generate-button'
- waitForAnimationToEnd
# Bounded wait, not a bare assert — the mint is a live POST round-trip.
- extendedWaitUntil:
    visible:
      id: 'invite-code-value'
    timeout: 15000
- takeScreenshot: parent-minted-offer-invite
- copyTextFrom:
    id: 'invite-code-value'
- tapOn:
    id: 'invite-screen-cta'
- waitForAnimationToEnd

# `-skip`, never `-cta`: the CTAs fire real OS permission dialogs (see flow
# 14's header for why).
- extendedWaitUntil:
    visible:
      id: 'notifications-permission-screen'
    timeout: 25000
- tapOn:
    id: 'notifications-permission-screen-skip'
- waitForAnimationToEnd
- assertVisible:
    id: 'calendar-permission-screen'
- tapOn:
    id: 'calendar-permission-screen-skip'
- extendedWaitUntil:
    visible:
      id: 'today-header'
    timeout: 25000

# --- Nanny: join via the code, fresh account, wizard path -----------------
- runFlow:
    file: ../flows/login-no-household.yaml
    env:
      PARENT_EMAIL: ${PHASE4_OFFER_NANNY_EMAIL}
      PARENT_PASSWORD: ${PHASE4_TEST_PASSWORD}

- extendedWaitUntil:
    visible:
      id: 'role-screen'
    timeout: 25000
- tapOn:
    id: 'role-nanny'
- tapOn:
    id: 'role-screen-cta'
- waitForAnimationToEnd

- assertVisible:
    id: 'start-screen'
- tapOn:
    id: 'start-join'
- tapOn:
    id: 'start-screen-cta'
- waitForAnimationToEnd

- assertVisible:
    id: 'code-screen'
- tapOn:
    id: 'name-input'
- eraseText
- inputText: 'Phase4 Offer Nanny'
- hideKeyboard
- tapOn:
    id: 'code-input'
- inputText: ${maestro.copiedText}
- hideKeyboard
# Dismiss on non-interactive content, not `hideKeyboard` — see flow 14's
# header for why the CTA sits behind the keyboard otherwise.
- tapOn:
    text: 'Join your household'
- waitForAnimationToEnd
- tapOn:
    id: 'code-screen-cta'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'code-preview-card'
    timeout: 15000
- assertNotVisible:
    id: 'code-error'
- takeScreenshot: nanny-offer-code-preview
- tapOn:
    id: 'code-screen-cta'
- waitForAnimationToEnd
# Fresh nanny has no live household of her own, so absorption never fires —
# same branch flow 14 proves on the parent side.
- assertNotVisible:
    id: 'absorption-sheet'

# NANNY x JOIN inserts AVAILABILITY between CODE and the permission screens
# (`stepsForRole` in domains/setup/types) — flow 14's joiner is a PARENT,
# whose join path has no availability step, so this block has no precedent
# there. Finish is disabled until a day is selected (AvailabilityScreen's
# `ctaDisabled={selectedDays.length === 0}`); toggle Monday (Postgres dow 1).
- extendedWaitUntil:
    visible:
      id: 'availability-screen'
    timeout: 25000
- tapOn:
    id: 'availability-week-strip-day-1'
- waitForAnimationToEnd
- assertVisible:
    id: 'availability-screen-cta'
    enabled: true
- tapOn:
    id: 'availability-screen-cta'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'notifications-permission-screen'
    timeout: 25000
- tapOn:
    id: 'notifications-permission-screen-skip'
- waitForAnimationToEnd
- assertVisible:
    id: 'calendar-permission-screen'
- tapOn:
    id: 'calendar-permission-screen-skip'
- extendedWaitUntil:
    visible:
      id: 'today-header'
    timeout: 25000

# --- Her proposal, surfaced on the inbox: review, then ACCEPT (B1) --------
- openLink: steadilynanny:///(private)/inbox
- extendedWaitUntil:
    visible:
      id: 'inbox-list'
    timeout: 25000
- scrollUntilVisible:
    element:
      id: 'inbox-item-terms_proposal-.*'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'inbox-item-terms_proposal-.*'
- extendedWaitUntil:
    visible:
      id: 'proposal-review-screen'
    timeout: 25000
- assertVisible:
    id: 'proposal-rate'
- assertVisible:
    id: 'proposal-state-pill'
- takeScreenshot: nanny-reviews-parent-offer
# The agree/counter/decline stack sits IN-SCROLL below the full terms
# document (~16 rows), fully off-screen on this device — scroll to it. Safe
# to use scrollUntilVisible here (unlike invite-generate-button): this screen
# has no pinned footer, so a frame inside the screen IS real pixels.
- scrollUntilVisible:
    element:
      id: 'proposal-agree-button'
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'proposal-agree-button'
- waitForAnimationToEnd
- assertVisible:
    id: 'proposal-accept-sheet'
- assertVisible:
    id: 'proposal-accept-summary'
# D-7 — refused without `responsibility_confirmed`; the button starts disabled.
- assertVisible:
    id: 'proposal-accept-confirm'
    enabled: false
- tapOn:
    id: 'proposal-accept-checkbox'
- tapOn:
    id: 'proposal-accept-confirm'
- waitForAnimationToEnd
# The post-accept `router.replace` fires only once the arrangement insert has
# RETURNED — landing on the carer's own pay surface IS the evidence B1's
# accept worked. `my-pay-screen`, NOT `pay-screen`: `/settings/pay` is the
# PARENT's management surface and gates a carer to `pay-not-available` — the
# original redirect sent her there and this flow's first run past the tap
# caught it (fixed in ProposalReviewScreen's accept redirect, now role-forked).
- extendedWaitUntil:
    visible:
      id: 'my-pay-screen'
    timeout: 25000
- assertVisible:
    id: 'my-pay-household-.*'
- assertNotVisible:
    id: 'my-pay-empty-.*'
- takeScreenshot: nanny-accepted-parent-offer

# --- Same arrangement, visible on the PARENT'S side ------------------------
- runFlow:
    file: ../flows/login-no-household.yaml
    env:
      PARENT_EMAIL: ${PHASE4_OFFER_PARENT_EMAIL}
      PARENT_PASSWORD: ${PHASE4_TEST_PASSWORD}
- openLink: steadilynanny:///(private)/settings/pay
- extendedWaitUntil:
    visible:
      id: 'pay-screen'
    timeout: 25000
- assertVisible:
    id: 'pay-current-terms-card'
- assertNotVisible:
    id: 'pay-empty-no-arrangement'
- takeScreenshot: parent-sees-live-arrangement
