# [audit-2026-08-17] Target D (P1) — on an approved week with a payment
# recorded, the reopen dialog is REFUSED server-side ("You've paid ... Adjust
# it in the next payment."), and the week stays approved.
#
# Run BEFORE 23b/23c (the API-down/API-back halves of target B) — this flow's
# own actions (approve, record a payment) are what makes the week "settled"
# for those to read.
#
# FIXTURE (remote D1, from the repo root):
#   D1_REMOTE=1 CLOUDFLARE_ACCOUNT_ID=... bun run scripts/seed-phase4-fixtures.ts
#     -> resets the seed week 2026-01-05 to `submitted` with no payments, but
#        also DELETES carer 1's pay arrangement, so then:
#   D1_REMOTE=1 CLOUDFLARE_ACCOUNT_ID=... bun run scripts/seed-carer1-terms.ts
#     -> 1500 minor/hr arrangement so the week has a priced gross to approve.
# Single-use: after a run the week is approved + paid; re-seed both to re-run.
appId: com.jetto.steadily.nanny
tags:
  - audit-2026-08-17
---
- runFlow: ../flows/login.yaml
- openLink: steadilynanny:///(private)/(tabs)/hours?weekStart=${PHASE4_SEED_WEEK_START}
- waitForAnimationToEnd
- assertVisible:
    id: 'hours-screen'
- assertVisible:
    id: 'hours-active-week-${PHASE4_SEED_WEEK_START}'

- tapOn:
    id: 'hours-approve-button'
- waitForAnimationToEnd
- assertVisible:
    id: 'hours-approve-dialog'
- tapOn:
    id: 'hours-approve-dialog-confirm'
- waitForAnimationToEnd
- assertVisible:
    id: 'hours-approve-button'
    enabled: false
- takeScreenshot: 23a-week-approved

- scrollUntilVisible:
    element:
      id: 'hours-mark-paid-button'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'hours-mark-paid-button'
- waitForAnimationToEnd
- assertVisible:
    id: 'hours-record-payment-sheet'
- tapOn:
    id: 'hours-record-payment-amount-input'
- eraseText
- inputText: '40.00'
- tapOn:
    id: 'hours-record-payment-date-chip-today'
- tapOn:
    id: 'hours-record-payment-method-input'
- inputText: 'Bank transfer'
- tapOn:
    id: 'hours-record-payment-submit'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'hours-record-payment-sheet'
- takeScreenshot: 23a-payment-recorded

# After the payment sheet closes the list is scrolled PAST the reopen button,
# which sits at the very top of the list, UNDER the status bar ([44,21][208,69]
# measured). The hours list starts at y=0, so a 100%-visible check passes and
# the tap lands on the status bar (iOS scroll-to-top) instead of the button.
# Scroll UP and centre it so the tap point is clear of the status bar.
- scrollUntilVisible:
    element:
      id: 'hours-reopen-button'
    direction: UP
    centerElement: true
    timeout: 15000
- tapOn:
    id: 'hours-reopen-button'
- waitForAnimationToEnd
- assertVisible:
    id: 'hours-reopen-dialog'
- tapOn:
    id: 'hours-reopen-dialog-reason'
- inputText: 'Testing the reopen refusal (audit-2026-08-17)'
- tapOn:
    id: 'hours-reopen-dialog-confirm'
- waitForAnimationToEnd
- assertVisible:
    id: 'hours-reopen-dialog-refusal'
# Maestro `text` is a FULL-match regex; the banner is one longer sentence
# that also names the recorded amount (hours.json reopenDialog.refusedPaid).
- assertVisible:
    text: ".*paid £40\\.00 on this week\\. Adjust it in the next payment.*"
- takeScreenshot: 23a-reopen-refused
- tapOn:
    id: 'hours-reopen-dialog-cancel'
- waitForAnimationToEnd
- assertVisible:
    id: 'hours-approve-button'
    enabled: false
- takeScreenshot: 23a-still-approved
