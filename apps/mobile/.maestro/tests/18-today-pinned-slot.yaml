# Scenario — P1: Today's pinned slot (`PinnedSlot.tsx`) is pinned by RANKING,
# not position — see `TodayScreen.tsx`'s module doc: the whole screen is ONE
# ScrollView (header, then the slot, then the feed), and the slot is always
# the FIRST card in it, never a floating overlay. That replaced the old
# design where the top card could fall under the fold. This flow proves the
# header + slot render, that the feed scrolls, and that the slot is still the
# first thing you see on scrolling back to the top — not that it stays fixed
# on screen while the feed scrolls past it (it doesn't; it scrolls too).
appId: com.jetto.steadily.nanny
tags:
  - today
---
# --- Parent: header + pinned slot present, feed scrolls beneath it --------
- runFlow: ../flows/login.yaml
# login.yaml's select-household.yaml step ends on the Settings tab (it opens
# the switcher from there and never taps back) — go to Today explicitly.
- tapOn:
    id: 'tab-today'
- waitForAnimationToEnd

- assertVisible:
    id: 'today-header'
- assertVisible:
    id: 'today-pinned-slot'
# On an ordinary day the parent's occupant is today's cover — his slot is only
# empty for a role with neither a clock nor a coverage view.
- assertVisible:
    id: 'today-coverage'
- takeScreenshot: today-pinned-slot-before-scroll

- scrollUntilVisible:
    element:
      id: 'today-this-week-card'
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: 'today-this-week-card'
- takeScreenshot: today-pinned-slot-after-scroll

# Scroll back to the top: the slot is pinned by RANK, so it must still be the
# first card there — same claim as before scrolling, not a new one.
- scrollUntilVisible:
    element:
      id: 'today-pinned-slot'
    direction: UP
    timeout: 10000
- assertVisible:
    id: 'today-header'
- assertVisible:
    id: 'today-pinned-slot'
- assertVisible:
    id: 'today-coverage'
- takeScreenshot: today-pinned-slot-back-at-top

# --- Nanny: on an ordinary day the slot's occupant is the clock-in control -
- runFlow: ../flows/login-nanny.yaml
- tapOn:
    id: 'tab-today'
- waitForAnimationToEnd

- assertVisible:
    id: 'today-header'
- assertVisible:
    id: 'today-pinned-slot'
- assertVisible:
    id: 'today-clock-card'
