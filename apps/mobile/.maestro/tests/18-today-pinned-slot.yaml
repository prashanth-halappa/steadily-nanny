# Scenario — P1: Today's pinned slot (`PinnedSlot.tsx`) is pinned by RANKING,
# not position — see `TodayScreen.tsx`'s module doc: the whole screen is ONE
# ScrollView (header, then the slot, then the feed), and the slot is always
# the FIRST card in it, never a floating overlay. That replaced the old
# design where the top card could fall under the fold. This flow proves the
# header + slot render, that the feed scrolls, and that the slot is still the
# first thing you see on scrolling back to the top — not that it stays fixed
# on screen while the feed scrolls past it (it doesn't; it scrolls too).
#
# FIXTURE — the "ordinary day" claims below (parent's occupant = today's
# cover, nanny's = the clock) need a viewer with NOTHING on the attention
# ladder (`resolveAttentionOwner`). The seed parent can never be that:
# `useInboxItems` reads EVERY household she belongs to, and the shared seed
# household carries flow 15's deliberately-pending absorbed proposal (rung
# `termsProposal`) plus flows 02-09's change requests / submitted weeks (rung
# `inbox`), so her slot correctly holds TermsProposalCard / NeedsAttentionCard
# — a correct app, a wrong fixture. So this flow signs in as the QUIET pair
# from `scripts/seed-phase4-fixtures.ts` point 10 (fresh accounts per seed:
# one household, one child, pay agreed, nothing else). Both login subflows
# select `${PHASE4_HOUSEHOLD_ID}`, so it is overridden per call (same reuse
# flow 21 documents). Read-only: no re-seed needed between runs.
appId: com.jetto.steadily.nanny
tags:
  - today
---
# --- Parent: header + pinned slot present, feed scrolls beneath it --------
- runFlow:
    file: ../flows/login.yaml
    env:
      PARENT_EMAIL: ${PHASE4_QUIET_PARENT_EMAIL}
      PARENT_PASSWORD: ${PHASE4_TEST_PASSWORD}
      PHASE4_HOUSEHOLD_ID: ${PHASE4_QUIET_HOUSEHOLD_ID}
# login.yaml's select-household.yaml step ends on the Settings tab (it opens
# the switcher from there and never taps back) — go to Today explicitly.
- tapOn:
    id: 'tab-today'
- waitForAnimationToEnd

- assertVisible:
    id: 'today-header'
- assertVisible:
    id: 'today-pinned-slot'
# On an ordinary day the parent's occupant is today's cover — his slot is only
# empty for a role with neither a clock nor a coverage view.
- assertVisible:
    id: 'today-coverage'
- takeScreenshot: today-pinned-slot-before-scroll

- scrollUntilVisible:
    element:
      id: 'today-this-week-card'
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: 'today-this-week-card'
- takeScreenshot: today-pinned-slot-after-scroll

# Scroll back to the top: the slot is pinned by RANK, so it must still be the
# first card there — same claim as before scrolling, not a new one.
- scrollUntilVisible:
    element:
      id: 'today-pinned-slot'
    direction: UP
    timeout: 10000
- assertVisible:
    id: 'today-header'
- assertVisible:
    id: 'today-pinned-slot'
- assertVisible:
    id: 'today-coverage'
- takeScreenshot: today-pinned-slot-back-at-top

# --- Nanny: on an ordinary day the slot's occupant is the clock-in control -
- runFlow:
    file: ../flows/login-nanny.yaml
    env:
      NANNY_EMAIL: ${PHASE4_QUIET_NANNY_EMAIL}
      NANNY_PASSWORD: ${PHASE4_TEST_PASSWORD}
      PHASE4_HOUSEHOLD_ID: ${PHASE4_QUIET_HOUSEHOLD_ID}
- tapOn:
    id: 'tab-today'
- waitForAnimationToEnd

- assertVisible:
    id: 'today-header'
- assertVisible:
    id: 'today-pinned-slot'
- assertVisible:
    id: 'today-clock-card'
