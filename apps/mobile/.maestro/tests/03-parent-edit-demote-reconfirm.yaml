# Scenario — parent edits a confirmed shift (demotes to pending) → nanny re-confirms.
#
# Prerequisites (.env.maestro):
#   PARENT_* / NANNY_* credentials
#   DEMOTED_SHIFT_ID — a confirmed shift the parent can edit (recurring/cover/
#     sequence>0). Parent Save demotes → pending + parent_proposed; nanny sees
#     shift-detail-needs-reconfirm (not fresh-proposal copy).
#
# Two-role on one simulator: parent edit → logout → nanny accept.
appId: com.jetto.steadily.nanny
tags:
  - scheduling
---
# --- Parent: edit times → Save demotes ---
- runFlow: ../flows/login.yaml
- openLink: steadilynanny:///(private)/schedule/shifts/${DEMOTED_SHIFT_ID}
- waitForAnimationToEnd
- assertVisible:
    id: 'shift-detail-screen'
- assertVisible:
    id: 'shift-detail-edit'
# Driving the native time picker (unblocked 2026-08-11; the older
# HARNESS-BLOCKED note claimed `shift-detail-times-start` / `-end` never reach
# the iOS accessibility tree — they DO. `maestro hierarchy` on this screen
# shows both with real bounds and their rendered values, e.g. "5:00 PM").
#
# The three steps below are one interaction with an iOS compact
# `DateTimePicker`, and each is here for a reason:
#   1. tap the field   — opens the hour/minute/AM-PM wheel in a POPOVER that
#                        covers the screen and swallows every other selector.
#   2. swipe the wheel — the popover's rows are NOT in the accessibility tree
#                        (only the three SELECTED values are), so there is
#                        nothing to tap; a swipe on the minutes column is the
#                        only way to move it. Any change demotes the shift, so
#                        this deliberately does not care WHICH minute it lands
#                        on — it only has to leave the range valid, which any
#                        minute does against a 09:00 start.
#   3. tap the margin  — the popover only closes on a tap OUTSIDE it. 2% x is
#                        the left gutter, clear of both the popover (x≥78pt)
#                        and every control (content starts at x=22pt). Do NOT
#                        dismiss near the bottom: 92% lands on the tab bar and
#                        navigates to Today (verified).
#
# The percentages are tied to the iPhone 16 Pro's 402x874pt screen that this
# suite runs on. On a materially different screen, re-derive them from
# `maestro hierarchy` rather than nudging them blind.
- tapOn:
    id: 'shift-detail-times-end'
- waitForAnimationToEnd
- swipe:
    start: 45%,60%
    end: 45%,54%
- waitForAnimationToEnd
- tapOn:
    point: 2%,50%
- waitForAnimationToEnd
# The popover is gone only if the screen underneath is addressable again.
- assertVisible:
    id: 'shift-detail-save'
- tapOn:
    id: 'shift-detail-save'
- waitForAnimationToEnd
# Time change on a CONFIRMED shift must demote it to pending (migration 034)
# and show the (not role-gated) reconfirm hint — shift-detail-status renders
# unconditionally regardless of status, so it alone proves nothing.
- assertVisible:
    id: 'shift-detail-status-pending'
- assertVisible:
    id: 'shift-detail-needs-reconfirm'
- takeScreenshot: parent-edited-demoted-shift

# --- Nanny: re-confirm demoted shift ---
# Pop back to a tab first — logout.yaml is wrapped in `when: visible:
# tab-settings`, and this screen (a pushed /(private)/schedule/shifts/[id]
# route outside (tabs)) has no tab bar, so logout would silently no-op and
# the nanny leg below would run as the still-signed-in parent.
- back
- waitForAnimationToEnd
- runFlow: ../flows/logout.yaml
- runFlow: ../flows/login-nanny.yaml
- openLink: steadilynanny:///(private)/schedule/shifts/${DEMOTED_SHIFT_ID}
- waitForAnimationToEnd
- assertVisible:
    id: 'shift-detail-screen'
- assertVisible:
    id: 'shift-detail-needs-reconfirm'
- tapOn:
    id: 'shift-detail-accept'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'shift-detail-accept'
- assertNotVisible:
    id: 'shift-detail-needs-reconfirm'
- assertVisible:
    id: 'shift-detail-status-confirmed'
- takeScreenshot: nanny-reconfirmed-demoted-shift
