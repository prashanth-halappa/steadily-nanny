# Shared helper subflow, NOT a standalone test (no launch, no assertions;
# run alone it is a no-op). Composed via `runFlow: cx-dismiss-open-alert.yaml`
# after an `openLink` by the cx-*.yaml capture flows and by numbered flows
# (26, 28-40). Clears the iOS "Open in ‘Steadily Nanny’?" system alert that a
# custom-scheme `openLink` can raise even without a reinstall (observed
# repeatedly navigating between deep links in one live session). No-op when
# the alert is absent. Lives in tests/ for historical reasons; queue runners
# should skip it.
appId: com.jetto.steadily.nanny
---
- extendedWaitUntil:
    visible:
      text: '^Open$'
    timeout: 4000
    optional: true
- runFlow:
    when:
      visible:
        text: '^Open$'
    commands:
      - tapOn:
          text: '^Open$'
      - waitForAnimationToEnd
