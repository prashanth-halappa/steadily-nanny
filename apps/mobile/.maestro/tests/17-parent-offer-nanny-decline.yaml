# Scenario — B4: a parent's pay offer (same P8 path as flow 16, driven fully
# live) that the nanny DECLINES rather than accepts. The round moves to
# `status: 'declined'` via `POST /terms-proposals/:id/decline`, behind
# `ProposalReviewScreen`'s `DeclineTermsDialog` confirm step. The claim under
# test is "the round shows declined, and the parent can still set pay" —
# since she is by then an ACTIVE member (redeem creates the membership
# unconditionally, before the offer is even looked at), "set pay" here is the
# ORDINARY first-arrangement path (`PaySetupScreen`, `useCreatePayArrangement`
# — a direct write, not a second proposal), not a fresh offer/redeem round.
#
# FIXTURES — `PHASE4_DECLINE_PARENT_EMAIL` / `PHASE4_DECLINE_NANNY_EMAIL`,
# two fresh CONFIRMED accounts with no household
# (`scripts/seed-phase4-fixtures.ts`, point 9), separate from flow 16's pair
# — a declined proposal still leaves the nanny an ACTIVE member (declining
# refuses the TERMS, not the membership), and 092's one-open-round index
# would otherwise let a stray retry collide with flow 16's already-accepted
# round on the same pair.
# STATUS 2026-08-15 — GREEN. The earlier stall on `invite-generate-button` was
# a Maestro artifact (the occlusion class), NOT a product bug — see flow 16's
# header for the full writeup: the button's unscrolled a11y frame
# ([22,814][380,862]) sat fully inside the 874pt screen so scrollUntilVisible
# no-oped and assertVisible passed, while the pixels were clipped behind the
# pinned footer; every tap landed at (201,838) in the footer's dead padding.
# Fixed with a real `scroll` swipe before the tap.
appId: com.jetto.steadily.nanny
tags:
  - pay
  - onboarding
---
# --- Parent: build a household from nothing, then invite with an offer ----
- runFlow:
    file: ../flows/login-no-household.yaml
    env:
      PARENT_EMAIL: ${PHASE4_DECLINE_PARENT_EMAIL}
      PARENT_PASSWORD: ${PHASE4_TEST_PASSWORD}

- extendedWaitUntil:
    visible:
      id: 'role-screen'
    timeout: 25000
- tapOn:
    id: 'role-parent'
- tapOn:
    id: 'role-screen-cta'
- waitForAnimationToEnd

- assertVisible:
    id: 'start-screen'
- tapOn:
    id: 'start-create'
- tapOn:
    id: 'start-screen-cta'
- waitForAnimationToEnd

- assertVisible:
    id: 'household-screen'
- tapOn:
    id: 'parent-name-input'
- eraseText
- inputText: 'Phase4 Decline Parent'
# `hideKeyboard`/a bare next-field tap are both unreliable here — occlusion
# class, confirmed twice on this screen in flow 16: first the CTA reported
# COMPLETED while still on household-screen with the keyboard up; then, even
# after dismissing before the CTA, `household-name-input` sits right on the
# keyboard's boundary so the tap never focused it — both strings landed in
# `parent-name-input`. Dismiss BETWEEN fields too, not just before the CTA.
- tapOn:
    text: 'Name your family'
- waitForAnimationToEnd
- tapOn:
    id: 'household-name-input'
- eraseText
- inputText: 'Phase4 Decline Household'
- tapOn:
    text: 'Name your family'
- waitForAnimationToEnd
# Converts a silent no-op tap into an immediate, obvious failure instead of a
# 15s timeout on the next screen.
- assertVisible:
    id: 'household-screen-cta'
    enabled: true
- tapOn:
    id: 'household-screen-cta'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'children-screen'
    timeout: 15000
- tapOn:
    id: 'children-add-button'
- waitForAnimationToEnd
- assertVisible:
    id: 'child-form-sheet'
- tapOn:
    id: 'child-form-name'
- inputText: 'Phase4 Kid'
- tapOn:
    id: 'child-form-age'
- inputText: '6'
- hideKeyboard
- tapOn:
    id: 'child-form-submit'
- waitForAnimationToEnd
- tapOn:
    id: 'children-screen-cta'
- waitForAnimationToEnd

- assertVisible:
    id: 'invite-screen'
- tapOn:
    id: 'invite-role-nanny'
- tapOn:
    id: 'invite-offer-add-button'
- waitForAnimationToEnd
- assertVisible:
    id: 'pay-offer-sheet'
- tapOn:
    id: 'pay-offer-rate-input'
- inputText: '19.00'
# Occlusion class, one level deeper than the scroll fix: the numeric pad
# covers `pay-offer-rate-input` itself once it opens, so the typed text can
# silently miss the field. Assert it landed before doing anything else — a
# missing rate makes `buildCreatePayArrangementRequest` return null, which
# correctly disables Submit and was previously misread as a scroll/tap miss.
- assertVisible:
    id: 'pay-offer-rate-input'
    text: '19.00'
# `hideKeyboard` doesn't reliably dismiss inside a BottomSheetBase either
# (occlusion class, confirmed in flow 16: `pay-offer-submit` — last of eight
# collapsible groups down a long scrollable sheet — was unreachable because
# the keyboard was still up). Dismiss on a non-interactive label instead.
- tapOn:
    text: 'Hourly rate'
- waitForAnimationToEnd
- tapOn:
    id: 'pay-offer-cancellation-chip-none'
- scrollUntilVisible:
    element:
      id: 'pay-offer-submit'
    direction: DOWN
    timeout: 10000
# Occlusion class, third layer: scrolling to the note field re-focuses it and
# summons the keyboard AGAIN, right back over `pay-offer-submit` at the
# bottom of the sheet. "Note (optional)" is the note INPUT's placeholder, not
# a label — tapping it re-focuses the field and raises the keyboard rather
# than dismissing it (confirmed: the next assert failed on this exact
# mistake). "How often you pay" is a genuinely non-interactive section
# heading (`PayScheduleFields.tsx`, a plain `<Small>`) in view at this scroll
# position — use that instead.
- tapOn:
    text: 'How often you pay'
- waitForAnimationToEnd
# Prove the keyboard is actually down rather than assuming it — `Dictate`
# only exists in the tree while the iOS keyboard is on screen.
- assertNotVisible:
    text: 'Dictate'
# Occlusion class, FOURTH layer: dismissing the keyboard reflows the sheet —
# it regains the ~300pt the keyboard occupied — so the scroll offset that had
# `pay-offer-submit` in view is stale the moment the keyboard goes. Scroll
# AGAIN now that the layout is final. Order matters: scroll, dismiss, THEN
# re-scroll; dismissing first doesn't work because the dismissal target has to
# already be on screen to tap.
- scrollUntilVisible:
    element:
      id: 'pay-offer-submit'
    direction: DOWN
    timeout: 10000
# Converts "the app correctly refused an incomplete offer" into an immediate,
# obvious failure right here instead of a confusing miss two screens later.
- assertVisible:
    id: 'pay-offer-submit'
    enabled: true
- tapOn:
    id: 'pay-offer-submit'
- waitForAnimationToEnd
# Assert the IMMEDIATE effect of the tap, not the downstream one — a COMPLETED
# tap proves nothing about what was physically under it (the occlusion class).
# If the sheet is still open, the submit didn't take. `waitForAnimationToEnd`
# is not reliable for `BottomSheetBase`'s own close animation (same component
# `- back` already doesn't dismiss, per the harness notes) — a bounded wait
# instead of a bare assert, so this doesn't race the dismissal.
- extendedWaitUntil:
    notVisible:
      id: 'pay-offer-sheet'
    timeout: 8000
- assertVisible:
    id: 'invite-offer-summary'
# The occlusion class, one more shape: with the P8 offer summary on screen,
# `invite-generate-button`'s UNSCROLLED a11y frame is [22,814][380,862] —
# fully inside the 874pt screen — so `scrollUntilVisible` (frame-based,
# occlusion-blind) NO-OPS and `assertVisible` passes, while the pixels are
# clipped behind the pinned footer (CTA y760-808 + its pb-8/safe-area down to
# y874). Every tap went to (201,838), the footer's dead padding BELOW the
# CTA, and reported COMPLETED (maestro.log, all 2026-08-15 runs). A real
# `scroll` swipe moves the ScrollView to its bottom, landing the button at
# ~y584-632 — genuinely clear of the footer — so the id-tap's refreshed
# frame meets real pixels.
- scroll
- waitForAnimationToEnd
- assertVisible:
    id: 'invite-generate-button'
    enabled: true
- tapOn:
    id: 'invite-generate-button'
- waitForAnimationToEnd
# Bounded wait, not a bare assert — the mint is a live POST round-trip.
- extendedWaitUntil:
    visible:
      id: 'invite-code-value'
    timeout: 15000
- takeScreenshot: decline-parent-minted-offer-invite
- copyTextFrom:
    id: 'invite-code-value'
- tapOn:
    id: 'invite-screen-cta'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'notifications-permission-screen'
    timeout: 25000
- tapOn:
    id: 'notifications-permission-screen-skip'
- waitForAnimationToEnd
- assertVisible:
    id: 'calendar-permission-screen'
- tapOn:
    id: 'calendar-permission-screen-skip'
- extendedWaitUntil:
    visible:
      id: 'today-header'
    timeout: 25000

# --- Nanny: join, then DECLINE instead of agreeing (B4) --------------------
- runFlow:
    file: ../flows/login-no-household.yaml
    env:
      PARENT_EMAIL: ${PHASE4_DECLINE_NANNY_EMAIL}
      PARENT_PASSWORD: ${PHASE4_TEST_PASSWORD}

- extendedWaitUntil:
    visible:
      id: 'role-screen'
    timeout: 25000
- tapOn:
    id: 'role-nanny'
- tapOn:
    id: 'role-screen-cta'
- waitForAnimationToEnd

- assertVisible:
    id: 'start-screen'
- tapOn:
    id: 'start-join'
- tapOn:
    id: 'start-screen-cta'
- waitForAnimationToEnd

- assertVisible:
    id: 'code-screen'
- tapOn:
    id: 'name-input'
- eraseText
- inputText: 'Phase4 Decline Nanny'
- hideKeyboard
- tapOn:
    id: 'code-input'
- inputText: ${maestro.copiedText}
- hideKeyboard
- tapOn:
    text: 'Join your household'
- waitForAnimationToEnd
- tapOn:
    id: 'code-screen-cta'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'code-preview-card'
    timeout: 15000
- assertNotVisible:
    id: 'code-error'
- tapOn:
    id: 'code-screen-cta'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'absorption-sheet'

# NANNY x JOIN inserts AVAILABILITY between CODE and the permission screens —
# see flow 16's matching block for the full why. Finish is disabled until a
# day is selected; toggle Monday (Postgres dow 1).
- extendedWaitUntil:
    visible:
      id: 'availability-screen'
    timeout: 25000
- tapOn:
    id: 'availability-week-strip-day-1'
- waitForAnimationToEnd
- assertVisible:
    id: 'availability-screen-cta'
    enabled: true
- tapOn:
    id: 'availability-screen-cta'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'notifications-permission-screen'
    timeout: 25000
- tapOn:
    id: 'notifications-permission-screen-skip'
- waitForAnimationToEnd
- assertVisible:
    id: 'calendar-permission-screen'
- tapOn:
    id: 'calendar-permission-screen-skip'
- extendedWaitUntil:
    visible:
      id: 'today-header'
    timeout: 25000

- openLink: steadilynanny:///(private)/inbox
- extendedWaitUntil:
    visible:
      id: 'inbox-list'
    timeout: 25000
- scrollUntilVisible:
    element:
      id: 'inbox-item-terms_proposal-.*'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'inbox-item-terms_proposal-.*'
- extendedWaitUntil:
    visible:
      id: 'proposal-review-screen'
    timeout: 25000
# The agree/counter/decline stack sits IN-SCROLL below the full terms
# document, fully off-screen on this device — scroll to it. Safe to use
# scrollUntilVisible here (unlike invite-generate-button): this screen has no
# pinned footer, so a frame inside the screen IS real pixels.
- scrollUntilVisible:
    element:
      id: 'proposal-decline-button'
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- assertVisible:
    id: 'proposal-decline-button'
- tapOn:
    id: 'proposal-decline-button'
- waitForAnimationToEnd
- assertVisible:
    id: 'proposal-decline-dialog'
- assertVisible:
    id: 'proposal-decline-dialog-title'
- takeScreenshot: nanny-declines-offer-dialog
- tapOn:
    id: 'proposal-decline-dialog-confirm'
- waitForAnimationToEnd
# `handleDecline` does `router.back()` on success — no dialog left up is
# already evidence the decline mutation resolved.
- assertNotVisible:
    id: 'proposal-decline-dialog'

# --- Parent: the round reads declined, and she can still set pay ----------
- runFlow:
    file: ../flows/login-no-household.yaml
    env:
      PARENT_EMAIL: ${PHASE4_DECLINE_PARENT_EMAIL}
      PARENT_PASSWORD: ${PHASE4_TEST_PASSWORD}
- openLink: steadilynanny:///(private)/settings/pay
- extendedWaitUntil:
    visible:
      id: 'pay-screen'
    timeout: 25000
# The decline never touched the membership, only the terms — the household
# still has nothing agreed, which is what makes the ordinary setup path
# reachable next.
- assertVisible:
    id: 'pay-empty-no-arrangement'
- takeScreenshot: parent-sees-declined-still-no-arrangement

- openLink: steadilynanny:///(private)/settings/pay/setup/${PHASE4_DECLINE_NANNY_ID}
- extendedWaitUntil:
    visible:
      id: 'pay-setup-screen'
    timeout: 25000
- tapOn:
    id: 'pay-setup-rate-input'
- eraseText
- inputText: '20.00'
# `hideKeyboard` does NOT dismiss on this screen (flow 07, verified: focus
# never moves and later input lands in the still-focused rate field, while
# the chips and CTA sit under the keyboard — occlusion class). Tap empty
# space near the top instead, exactly as flow 07 does.
- tapOn:
    point: 50%,20%
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'pay-setup-cancellation-chip-none'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'pay-setup-cancellation-chip-none'
# Fails HERE by name if the chip tap was swallowed, instead of one step later
# as a mysteriously disabled CTA (flow 07's post-condition).
- assertNotVisible:
    id: 'pay-setup-cancellation-required-hint'
- assertVisible:
    id: 'pay-setup-screen-cta'
    enabled: true
- tapOn:
    id: 'pay-setup-screen-cta'
- waitForAnimationToEnd
# The screen only calls router.back() after the create mutation resolves, so
# leaving it is the post-condition that the arrangement actually landed.
- extendedWaitUntil:
    notVisible:
      id: 'pay-setup-screen'
    timeout: 20000
# `handleSubmit` does `router.back()`, not a fixed redirect — re-open the pay
# hub explicitly rather than trust where "back" lands from a deep link.
- openLink: steadilynanny:///(private)/settings/pay
- extendedWaitUntil:
    visible:
      id: 'pay-screen'
    timeout: 25000
- assertVisible:
    id: 'pay-current-terms-card'
- assertNotVisible:
    id: 'pay-empty-no-arrangement'
- takeScreenshot: parent-set-pay-after-decline
