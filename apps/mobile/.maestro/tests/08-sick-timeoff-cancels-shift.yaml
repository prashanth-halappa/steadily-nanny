# Scenario — nanny books a SICK day over a booked shift (3-E3's sick label +
# 3-T3's D-23: a sick day auto-opens a `cancel` change request against every
# overlapping shift); the parent then finds that request on the shift, and the
# S3 three-arm paid hint states what cancelling costs.
#
# Flow 06 covers plain time off through TimeOffRequestForm. This one is the
# SICK path, which is a different code path entirely: one tap, today only,
# all-day, no form, no date picker — which is also why this flow is NOT
# tagged `manual` the way 06 is. There is nothing fuzzy to drive.
#
# Prerequisites: scripts/seed-e2e-approval-fixtures.ts (its fixture 1 is the
# confirmed shift TODAY that the sick day overlaps) then
# scripts/seed-phase4-fixtures.ts, which clears today's sick row, the change
# requests it opened, and puts the shift back to `confirmed` so re-runs work.
#
# SCOPING NOTE — the S3 three-arm paid hint is NOT shown to the parent when
# they RESPOND to a cancel request: `shift-change-accept-*` / `-decline-*` fire
# the mutation immediately, with no dialog (ShiftDetailScreen's changes
# section). The three-arm sentence lives in the parent's OWN cancel dialog
# (`shift-detail-cancel-body`, one body assembled from CANCEL_PAY_KEY +
# `detail.cancelNeedsAccept`). So this flow asserts the auto-opened request via
# the response affordances, and asserts the paid-hint copy by opening — and
# then dismissing — the parent's cancel dialog on the same shift. It never
# confirms that second request; the shipped dialog is what is under test, not a
# second cancellation.
#
# SCOPING NOTE — there is no sick reason/label PICKER anywhere in the app.
# `TimeOffRequestForm` has no `kind` field at all; `kind: 'sick'` comes only
# from SickTimeOffButton. The "sick label" assertion is therefore the badge
# `time-off-kind-sick-<id>` on the resulting row.
appId: com.jetto.steadily.nanny
tags:
  - scheduling
  - timeoff
---
# --- Nanny: book a sick day over today's confirmed shift ------------------
- runFlow: ../flows/login-nanny.yaml
- runFlow:
    file: ../flows/select-household.yaml
    env:
      HOUSEHOLD_ID: ${PHASE4_HOUSEHOLD_ID}
- tapOn:
    id: 'tab-settings'
- waitForAnimationToEnd
- assertVisible:
    id: 'settings-screen'
- tapOn:
    id: 'settings-request-time-off'
- waitForAnimationToEnd
- assertVisible:
    id: 'time-off-screen'
- tapOn:
    id: 'time-off-sick-today'
- waitForAnimationToEnd
# Confirm dialog title/body carry no testID — visible text is the handle.
# (en/timeOff.json: sick.confirmTitle / sick.confirmBody)
# Text selectors are REGEX and are matched against the whole string, so a
# bare `?` is an optional-quantifier on the preceding char and never matches
# the literal question mark. Wrapped rather than escaped, so the same form
# works for the substring assertions below.
- assertVisible: '.*Book a sick day.*'
- assertVisible: 'The family will be notified. This books today off as a sick day.'
- tapOn:
    id: 'time-off-sick-confirm'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'time-off-sick-confirm'
# The sick BADGE is the label assertion. Row id carries a server-generated
# uuid, so the id is matched as a regex on its stable prefix. A pre-existing
# seeded time-off row on the same date sorts above the new one, pushing it
# below the fold — same "assertVisible on a bare id doesn't mean it's on
# SCREEN" gap as `shift-change-accept-.*` above, confirmed via screenshot
# showing a second matching-date row cut off at the bottom (2026-08-12).
- scrollUntilVisible:
    element:
      id: 'time-off-kind-sick-.*'
    direction: DOWN
- takeScreenshot: nanny-sick-day-booked

# --- Parent: the auto-opened cancel request on today's shift --------------
# Pop back to a tab first: /(private)/settings/time-off is outside (tabs), and
# logout.yaml is gated on `tab-settings` being visible, so it would silently
# no-op here and the parent leg would run as the nanny (flow 06's lesson).
- back
- waitForAnimationToEnd
- runFlow: ../flows/logout.yaml
- runFlow: ../flows/login.yaml
- runFlow:
    file: ../flows/select-household.yaml
    env:
      HOUSEHOLD_ID: ${PHASE4_HOUSEHOLD_ID}
- openLink: steadilynanny:///(private)/schedule/shifts/${PHASE4_TODAY_SHIFT_ID}
- waitForAnimationToEnd
- assertVisible:
    id: 'shift-detail-screen'
# D-23's actual product claim: a sick day did not just write a note, it opened
# a request the parent has to answer. The changes section only renders when at
# least one change request exists, so this is not tautological.
- assertVisible:
    id: 'shift-detail-changes'
# The Changes section sits near the bottom of this screen, after the day
# thread — the accept/decline row is off-screen until scrolled, and a bare
# `assertVisible` on the group container passing does not mean its CHILDREN
# are on screen too.
- scrollUntilVisible:
    element:
      id: 'shift-change-accept-.*'
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: 'shift-change-accept-.*'
- assertVisible:
    id: 'shift-change-decline-.*'
# TODO(testid): the kind ("cancellation") and status labels inside each change
# request card have no testID (ShiftDetailScreen.tsx, the two <Body>/<Small>
# above `shift-change-raised-by-*`). Matching them by visible text would pin
# i18n copy, so the response affordances above stand in for "it is a cancel".
- takeScreenshot: parent-sees-sick-cancel-request

# --- Parent: the S3 three-arm paid hint ----------------------------------
# Scroll to the control before tapping, and WAIT for the dialog rather than
# asserting instantly. The step immediately above scrolls DOWN to the change-
# request section, which leaves `shift-detail-cancel` somewhere else on a long
# shift-detail page — and this suite's recurring failure mode is a tap that
# Maestro reports COMPLETED while it actually lands on whatever is covering the
# control (Maestro's visibility test is hierarchy-based, not occlusion-based).
# The dialog is then a state change, not an animation, so `waitForAnimationToEnd`
# does not cover it either.
- scrollUntilVisible:
    element:
      id: 'shift-detail-cancel'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'shift-detail-cancel'
- extendedWaitUntil:
    visible:
      id: 'shift-detail-cancel-body'
    timeout: 15000
# S14 — every variant of the body ends with this clause, because the button
# opens a REQUEST and a dialog that reads like the shift is already cancelled
# would misrepresent it.
# A SUBSTRING of `shift-detail-cancel-body` (which is the pay sentence plus
# this clause), so it must be wrapped to match at all.
- assertVisible: '.*has to accept the cancellation before it.*'
- takeScreenshot: parent-cancel-paid-hint
- tapOn:
    id: 'shift-detail-cancel-dismiss'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'shift-detail-cancel-body'
