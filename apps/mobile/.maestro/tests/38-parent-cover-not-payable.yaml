# S5 gap — "I'm covering this" clears the uncovered-care warning and is NOT
# payable (docs/12-NEED-COVERAGE.md §6). `parent_cover` writes a real shift
# (`kind=parent_cover`, `carer_id=null`) so it drops out of `computeUncovered`
# like any other confirmed cover, but `weekEarningsService` only sums shifts
# where `shift.carer_id === carerId` — a carer-less row never enters pay.
#
# FIXTURES — run `D1_REMOTE=1 CLOUDFLARE_ACCOUNT_ID=… bun run
# scripts/seed-coverage-gap.ts` BEFORE EVERY RUN and pass its two keys
# (COVER_GAP_PARENT_EMAIL, COVER_GAP_HOUSEHOLD_ID; password is
# PHASE4_TEST_PASSWORD). It mints a fresh parent + nanny + child + agreed
# pay arrangement in a fresh 'Cover household', with ONE care commitment
# covering every day 00:00–23:59 and nothing booked, so today has exactly one
# uncovered window whatever the weekday or hour. The gap card's "I've got
# it" action renders only for a SINGLE window.
#
# WHY NOT PHASE4_HOUSEHOLD_ID (what this flow used to do): the approval
# seeder books nanny@ a confirmed 08:00–17:00 shift TODAY
# (PHASE4_TODAY_SHIFT_ID, flow 08), which covers that household's weekday
# 09:00–17:00 care hours, so it never has a gap today. And each run here
# leaves a parent_cover shift behind, so a shared household cannot be re-run.
# The commitment form itself is exercised by flow 40.
#
# SINGLE-USE PER SEED: the parent_cover this flow writes clears the gap.
appId: com.jetto.steadily.nanny
tags:
  - money
  - scheduling
---
# --- Parent: a fresh household with today uncovered (seed-coverage-gap) ---
- runFlow:
    file: ../flows/login.yaml
    env:
      PARENT_EMAIL: ${COVER_GAP_PARENT_EMAIL}
      PARENT_PASSWORD: ${PHASE4_TEST_PASSWORD}
      PHASE4_HOUSEHOLD_ID: ${COVER_GAP_HOUSEHOLD_ID}

# --- Parent: the gap shows on Today, and pay is untouched before acting ---
# login.yaml ends on Settings (a stack screen ABOVE (tabs), no tab bar), so
# deep-link the tab.
- openLink: steadilynanny:///(private)/(tabs)/home
- runFlow: cx-dismiss-open-alert.yaml
- extendedWaitUntil:
    visible:
      id: 'today-coverage-gap-card'
    timeout: 15000
- assertVisible:
    id: 'today-coverage-gap-headline'
- assertVisible:
    id: 'today-coverage-parent-cover'
- takeScreenshot: ${OUT}/s5-38-b-today-gap-before-cover

- openLink: steadilynanny:///(private)/(tabs)/hours
- runFlow: cx-dismiss-open-alert.yaml
- extendedWaitUntil:
    visible:
      id: 'hours-screen'
    timeout: 15000
- assertVisible:
    id: 'hours-earnings-line'
# Baseline the current week's payable total BEFORE covering — this is the
# figure the whole claim rests on staying put.
- copyTextFrom:
    id: 'hours-earnings-line'
- takeScreenshot: ${OUT}/s5-38-c-week-total-before-cover

# --- Parent: "I've got it" ------------------------------------------------
- tapOn:
    id: 'tab-today'
- waitForAnimationToEnd
- assertVisible:
    id: 'today-coverage-gap-card'
- tapOn:
    id: 'today-coverage-parent-cover'
# THE COVERAGE ASSERTION. `parent_cover` recomputes `computeUncovered` on the
# next fetch — no compensating event, no manual clear (docs/12-NEED-COVERAGE
# §4) — so the gap card must be gone, not just disabled.
- extendedWaitUntil:
    notVisible:
      id: 'today-coverage-gap-card'
    timeout: 15000
- takeScreenshot: ${OUT}/s5-38-d-today-gap-cleared

# --- Parent: the resulting row is on the agenda, muted, undoable ----------
- tapOn:
    id: 'tab-schedule'
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'schedule-parent-cover-undo-.*'
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: 'schedule-parent-cover-undo-.*'
# `cover.parentCoveringRow` — the SAME parent who covered it viewing their
# own row (ShiftRow.tsx: `parentId === currentUserId`).
- assertVisible: "You're covering"
- takeScreenshot: ${OUT}/s5-38-e-agenda-parent-cover-row

# --- THE MONEY ASSERTION. The payable total did not move. ----------------
- openLink: steadilynanny:///(private)/(tabs)/hours
- runFlow: cx-dismiss-open-alert.yaml
- extendedWaitUntil:
    visible:
      id: 'hours-screen'
    timeout: 15000
- assertVisible: ${maestro.copiedText}
- takeScreenshot: ${OUT}/s5-38-f-week-total-unchanged-after-cover
