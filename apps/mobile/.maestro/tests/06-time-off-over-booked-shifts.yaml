# Scenario — nanny time off overlapping booked shifts notifies the parent.
#
# Product path: TimeOffRequestForm conflict dialog → API creates time off and
# emits CARER_TIME_OFF_CONFLICT push (notificationRouteMap → schedule/shifts).
#
# Push cannot be delivered into Simulator reliably. After the nanny confirms
# the overlap dialog we:
#   1. Assert the request succeeded (row appears / form clears)
#   2. Switch to parent and openLink the same href the push would open
#   3. Assert schedule shifts / away UI is reachable
#
# Deterministic overlap (2026-11-22): the form's date range DEFAULTS to
# today, and seed-phase4-fixtures.ts guarantees nanny@ a CONFIRMED extra shift
# today (PHASE4_TODAY_SHIFT_ID) and deletes any time off of hers covering today.
# So with no date picking at all the busy-blocks check must find a conflict —
# the conflict dialog, the created row and the parent's away summary are all
# hard assertions now, not `when visible` branches.
#
# Prerequisites: NANNY_* + PARENT_*, and a fresh
#   D1_REMOTE=1 bun run scripts/seed-phase4-fixtures.ts
# THIS FLOW CONSUMES IT: it leaves an all-day time off on today for nanny@,
# which flow 08 (today's shift) and any re-run of this flow need cleared —
# re-run the seeder before either.
#
# Still tagged manual (excluded from `test:e2e*`) because of that fixture
# coupling with flow 08; run it after the phase-4 seeder.
#   cd apps/mobile && bash scripts/run-maestro.sh .maestro/tests/06-time-off-over-booked-shifts.yaml
appId: com.jetto.steadily.nanny
tags:
  - scheduling
  - manual
---
# --- Nanny: request time off that overlaps booked shifts ---
- runFlow: ../flows/login-nanny.yaml
- tapOn:
    id: 'header-settings'
- waitForAnimationToEnd
- assertVisible:
    id: 'settings-screen'
- tapOn:
    id: 'settings-request-time-off'
- waitForAnimationToEnd
- assertVisible:
    id: 'time-off-screen'
- assertVisible:
    id: 'time-off-request-form'
# Date range left at its default (today) — overlaps the seeded today-shift.
- tapOn:
    id: 'time-off-request-message'
- inputText: 'Family travel — overlaps today shift'
- hideKeyboard:
    optional: true # Maestro 2.12 + iOS 26 throws when it cannot dismiss; was a silent no-op
- tapOn:
    id: 'time-off-request-submit'
# The overlap MUST raise the conflict dialog; confirming notifies parents
# server-side (CARER_TIME_OFF_CONFLICT).
- extendedWaitUntil:
    visible:
      id: 'time-off-conflict-confirm'
    timeout: 15000
- tapOn:
    id: 'time-off-conflict-confirm'
- waitForAnimationToEnd
- assertVisible:
    id: 'time-off-list'
# The created row (below the form, so scroll the list to it).
- scrollUntilVisible:
    element: '.*overlaps today shift.*'
    direction: DOWN
    timeout: 20000
- takeScreenshot: nanny-time-off-submitted

# --- Parent: land where CARER_TIME_OFF_CONFLICT push would deep-link ---
# Land on Settings first — this screen is /(private)/settings/time-off, a
# child of Settings, and logout.yaml's own entry guard is the
# `header-settings` gear, which only the ROOT screens carry.
#
# NOT `- back`, and NOT tapping `time-off-back` either (WP-M, 2026-08-18):
# both reproduced the exact same failure (this flow and 08, twice each) —
# `tapOnElement` on `time-off-back` reports COMPLETED (confirmed via the
# run's own commands-*.json, even scrolled to the top of the FlashList's
# `ListHeaderComponent` first) but the app is still on `time-off-screen` a
# beat later. Root cause not chased further (budget) — deep-link to Settings
# directly instead, same recovery `reset-to-welcome.yaml` itself uses.
- openLink: steadilynanny:///(private)/settings
- waitForAnimationToEnd
- runFlow: ../flows/logout.yaml
- runFlow: ../flows/login.yaml
- openLink: steadilynanny:///(private)/schedule/shifts
- waitForAnimationToEnd
- assertVisible:
    id: 'schedule-shifts-screen'
# The nanny's time off covers today, so this week's Agenda (the default view)
# carries her away row with her note. `schedule-away-summary` is NOT the
# target: it is only in the Week-ribbon/cross-family header, by design.
- scrollUntilVisible:
    element: '.*overlaps today shift.*'
    direction: DOWN
    timeout: 20000
- takeScreenshot: parent-schedule-after-time-off-conflict
