# Scenario — parent authors pay terms in the 3-U1 setup form (common-defaults
# preset behind the D-7 liability checkbox, then CA-style daily tiers typed by
# hand), backdated to cover the seed weeks; then the overtime week prices
# overtime AND double time in the breakdown sheet.
#
# Prerequisites: scripts/seed-phase4-fixtures.ts, which
#   - DELETES every pay_arrangement for (household, nanny). Required, not
#     cosmetic: PaySetupScreen's mount effect does
#     `router.replace('/settings/pay')` the moment an arrangement exists, so
#     the setup form is only reachable on a carer who has none. That is also
#     why this flow never needs the PayChangeSheet path — the seeder makes
#     setup mode the deterministic one rather than branching at runtime.
#   - seeds a submitted timesheet + a single 13h entry on
#     PHASE4_OT_WEEK_START (8 regular + 4 overtime + 1 double time).
#
# SCOPING NOTE — D-52 deleted the per-state presets; COMMON_DEFAULTS_PRESET is
# the only one left (packages/shared-types/src/payTermsPresets.ts), and its
# values ARE the CA-style set this flow wants (weekly 40h ×1.5, daily OT after
# 8h, double time after 12h ×2). The flow still retypes the daily tier fields
# after applying it, so a preset that silently stopped populating them would
# not be papered over by the assertion below.
#
# SCOPING NOTE — there is no `pay-setup-daily-overtime-multiplier-input`: daily
# overtime is deliberately paid at the WEEKLY multiplier (see the comment in
# PayTermsGroups.tsx above the daily threshold field). Nothing to set.
appId: com.jetto.steadily.nanny
tags:
  - pay
  - money
---
- runFlow: ../flows/login.yaml
- runFlow:
    file: ../flows/select-household.yaml
    env:
      HOUSEHOLD_ID: ${PHASE4_HOUSEHOLD_ID}

# No settings row deep-links to setup; the route is /settings/pay/setup/<carerId>.
- openLink: steadilynanny:///(private)/settings/pay/setup/${PHASE4_NANNY_ID}
- waitForAnimationToEnd
- assertVisible:
    id: 'pay-setup-screen'

# --- Hourly rate + backdated effective date ------------------------------
- tapOn:
    id: 'pay-setup-rate-input'
- eraseText
- inputText: ${PHASE4_HOURLY_RATE}
- tapOn:
    point: 50%,20%
- waitForAnimationToEnd
# The date input sits UNDER the keyboard once the rate field has focus, and
# two things that look like they should fix that do not:
#   - `hideKeyboard` does not dismiss it on this screen at all (verified: the
#     date landed in the RATE field, because focus never moved and eraseText +
#     inputText went to whatever was still focused);
#   - `scrollUntilVisible` no-ops, because Maestro's visibility test is
#     hierarchy-based, not occlusion-based — the field is already "visible" to
#     it while being physically behind the keyboard, so it never scrolls and
#     the tap still lands on a key.
# An explicit swipe is the only one that moves the content: it lifts
# "Takes effect from" above the keyboard, and THEN the tap reaches the field.
- swipe:
    start: 50%,60%
    end: 50%,35%
- waitForAnimationToEnd
- tapOn:
    id: 'pay-setup-date-input'
- eraseText
- inputText: ${PHASE4_ARRANGEMENT_VALID_FROM}
# Backdating is unbounded (only the 12-month FUTURE horizon is refused), so a
# past date must show the hint and NOT the error — this asserts the difference.
- assertVisible:
    id: 'pay-setup-backdating-hint'
- assertNotVisible:
    id: 'pay-setup-date-error'

# The keyboard is STILL up from the date field (same story as the rate→date
# transition above: hideKeyboard is a no-op on this screen, scrollUntilVisible
# no-ops because Maestro's visibility check is hierarchy-based, not
# occlusion-based). Left alone, `pay-setup-group-overtime` sits right at the
# keyboard's top edge and either swallows the tap or opens content that
# renders behind the keyboard — "Element not found: pay-setup-preset-button"
# either way. Same swipe fix, same reason: scroll the content, don't fight
# the keyboard.
- swipe:
    start: 50%,60%
    end: 50%,35%
- waitForAnimationToEnd

# --- Overtime group: apply the preset behind the D-7 checkbox -------------
# TermGroup only opens by default when the group already has a value, and a
# first-ever arrangement has none — so open it, guarded so a re-render that
# left it open does not get toggled shut.
- runFlow:
    when:
      notVisible:
        id: 'pay-setup-group-overtime-content'
    commands:
      - tapOn:
          id: 'pay-setup-group-overtime'
      - waitForAnimationToEnd
- assertVisible:
    id: 'pay-setup-group-overtime-content'

# `pay-setup-preset-button` is the LAST child of this group, deliberately
# (PayTermsGroups.tsx §5.1: "presets never lead", the offer sits after every
# field). It is in the hierarchy and Maestro reports the tap COMPLETED
# ("dispatched", not "reacted to"), but the sheet never opened — the
# keyboard from the date field above was still up and covering the bottom
# ~45% of the screen, so the tap landed on the keyboard's input-accessory
# band, not the button. `hideKeyboard` + scroll the button into view first.
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'pay-setup-preset-button'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'pay-setup-preset-button'
- waitForAnimationToEnd
- assertVisible:
    id: 'pay-preset-sheet'
- assertVisible:
    id: 'pay-preset-disclaimer'
# D-7: the confirm is `disabled` until the liability box is checked AND its
# onPress early-returns without it. Asserting the disabled state first is what
# makes this a test of the gate rather than of the tap order.
- assertVisible:
    id: 'pay-preset-confirm'
    enabled: false
- tapOn:
    id: 'pay-preset-checkbox'
- tapOn:
    id: 'pay-preset-confirm'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'pay-preset-sheet'
- assertVisible:
    id: 'pay-setup-preset-applied-note'

# --- CA-style daily tiers, typed by hand ---------------------------------
# `tapOn: point: 50%,20%` (blank-space dismiss) is what this section used to
# use between fields. Once the Overtime group is open and scrolled, that
# fixed relative point lands on the group's OWN collapse toggle instead of
# blank space, closing it and taking every field below out of the
# hierarchy — confirmed via a hierarchy dump showing the group summary
# ("After 40h, at 1.5×") collapsed after the first one. `hideKeyboard`
# dismisses without tapping any coordinate, so it can't hit the toggle.
- tapOn:
    id: 'pay-setup-overtime-threshold-input'
- eraseText
- inputText: '40'
- hideKeyboard
- tapOn:
    id: 'pay-setup-overtime-multiplier-input'
- eraseText
- inputText: '1.5'
- hideKeyboard
- tapOn:
    id: 'pay-setup-daily-overtime-threshold-input'
- eraseText
- inputText: '8'
- hideKeyboard
- tapOn:
    id: 'pay-setup-doubletime-threshold-input'
- eraseText
- inputText: '12'
- hideKeyboard
- tapOn:
    id: 'pay-setup-doubletime-multiplier-input'
- eraseText
- inputText: '2'
- hideKeyboard
- takeScreenshot: pay-setup-ca-overtime

# --- Worked-holiday multiplier (flow 09 consumes this same arrangement) ---
- runFlow:
    when:
      notVisible:
        id: 'pay-setup-group-holidays-content'
    commands:
      - scrollUntilVisible:
          element:
            id: 'pay-setup-group-holidays'
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: 'pay-setup-group-holidays'
      - waitForAnimationToEnd
- tapOn:
    id: 'pay-setup-worked-holiday-multiplier-input'
- eraseText
- inputText: ${PHASE4_HOLIDAY_MULTIPLIER}
# `hideKeyboard`, NOT `tapOn: point: 50%,20%`. This was the last surviving
# instance of the blind-fixed-point dismiss that the comment above the daily
# tiers already indicts, and it is the ROOT CAUSE of this flow's long-standing
# failure — measured 2026-08-12, not theorised:
#
# By this point the form is scrolled so that `pay-setup-preset-button` (label
# "Use common defaults", pay.json `preset.button`) sits at ~20% of screen
# height. So 50%,20% lands ON THAT BUTTON and RE-OPENS the preset sheet. The
# sheet then covers the form and hides the a11y tree beneath it, so the
# `scrollUntilVisible` for `pay-setup-cancellation-chip-none` below can never
# find the chip; the chip is never selected; and the Save CTA therefore stays
# disabled. That disabled CTA was read in Phase 5 as an app defect — it is
# this stray tap, one step earlier.
#
# Proof: at the failure the live hierarchy still contained
# `resource-id=pay-preset-sheet`, with `pay-preset-checkbox` reading
# `value=checkbox, unchecked` and `pay-preset-confirm` carrying NO `enabled`
# attribute — i.e. a FRESHLY re-opened sheet, not the one the flow had already
# confirmed and closed successfully several steps earlier.
- hideKeyboard
- waitForAnimationToEnd

# Cancellations: "the one term with no blank state" (screen copy) — the CTA
# stays disabled without a choice here, and this flow never made one. Added
# last, right before the CTA: doing it earlier (next to the date field it
# sits beside on screen) disturbed the swipe/keyboard choreography for the
# Overtime group that follows.
# `centerElement: true` and DOWN, not a bare `direction: UP` — measured from a
# live hierarchy dump at the moment this used to fail:
#   - the form is at scroll offset 0% (TOP) when we arrive, so UP had nowhere to
#     go and the scroll was a no-op;
#   - the chip's bounds were [22,780][205,828] while the scroll viewport ends at
#     760 and the NUMERIC KEYBOARD occupied [0,566][402,874]. The chip was both
#     below the fold AND behind the keyboard.
# Maestro's visibility test is hierarchy-based, not occlusion-based (as two
# other comments in this file already record), so `scrollUntilVisible` decided
# the chip was already "visible", scrolled nothing, and the `tapOn` dispatched
# at (113,804) — which is the '.' key of the number pad, not the chip. Maestro
# reported it COMPLETED. `centerElement` forces the chip to the middle of the
# viewport (~y456), clear of the keyboard, so the tap reaches it.
# Three steps, because two things are wrong at once here and each needs its own
# fix. Measured from live hierarchy dumps at 0% and 100% scroll offsets:
#
#  (1) SCROLL OFFSET IS UNKNOWN on arrival. A bare `direction: UP` assumed we
#      were below the cancellations; a bare `direction: DOWN` overshot to 100%
#      and the chip left the a11y tree entirely (this ScrollView drops
#      off-viewport children, so an overshoot is unrecoverable). So establish a
#      KNOWN offset first by scrolling UP to the form's first field.
#  (2) THE NUMERIC KEYBOARD IS UP, occupying [0,566][402,874] and covering the
#      chip's row. Maestro's visibility test is hierarchy-based, not
#      occlusion-based, so it happily "finds" the chip and taps a number key
#      instead (the '.' key, at the chip's exact centre). `hideKeyboard` does
#      not work on this screen — recorded twice above. What DOES work is a tap
#      on non-interactive content, which is all `point: 50%,20%` ever was: at
#      scroll-top that coordinate is the screen TITLE. Anchoring to the title's
#      own text instead of the coordinate is what makes it stop breaking when
#      the form is scrolled somewhere else.
- scrollUntilVisible:
    element:
      id: 'pay-setup-rate-input'
    direction: UP
    timeout: 10000
# Tap `pay-setup-backdating-hint` to dismiss the keyboard: it is a `<Small>`
# with a testID, NON-INTERACTIVE (no onPress, so it is not a touch responder
# and the tap falls through to the ScrollView, whose default
# keyboardShouldPersistTaps='never' dismisses the keyboard), and after the
# scroll above it sits at [22,392][380,434] — comfortably clear of the
# keyboard's [0,566] top edge. The screen TITLE was the obvious choice and does
# NOT work: after this scroll it is at y=-71, above the viewport, and Maestro
# reports "Element not found".
- tapOn:
    id: 'pay-setup-backdating-hint'
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'pay-setup-cancellation-chip-none'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'pay-setup-cancellation-chip-none'
# Post-condition, so a swallowed tap fails HERE by name instead of surfacing one
# step later as a mysteriously disabled CTA — which is exactly how this was
# mis-read as an app defect. The hint renders ONLY while
# `state.cancellationChoice === null` (PayTermsRequiredCore.tsx:135).
- assertNotVisible:
    id: 'pay-setup-cancellation-required-hint'

# --- Save ----------------------------------------------------------------
# `pay-setup-screen-cta` is derived inside SetupScreenShell (`${testID}-cta`),
# label "Save pay terms". It is `disabled` whenever the form does not build a
# valid request, so an enabled assertion here is a real precondition check.
- assertVisible:
    id: 'pay-setup-screen-cta'
    enabled: true
- tapOn:
    id: 'pay-setup-screen-cta'
- waitForAnimationToEnd
# The screen only calls router.back() after the create mutation resolves, so
# leaving it is the post-condition that the arrangement actually landed.
- extendedWaitUntil:
    notVisible:
      id: 'pay-setup-screen'
    timeout: 20000
- takeScreenshot: pay-terms-saved

# --- The overtime week now prices both daily tiers -----------------------
- openLink: steadilynanny:///(private)/(tabs)/hours?weekStart=${PHASE4_OT_WEEK_START}
- waitForAnimationToEnd
- assertVisible:
    id: 'hours-screen'
- assertVisible:
    id: 'hours-active-week-${PHASE4_OT_WEEK_START}'
- assertVisible:
    id: 'hours-earnings-line'
- tapOn:
    id: 'hours-earnings-line-pressable'
- waitForAnimationToEnd
- assertVisible:
    id: 'hours-earnings-breakdown'
# The two lines this whole flow exists for. Line slugs are hand-written per
# `line.kind` in EarningsBreakdownSheet's switch — `overtime` and `doubletime`
# happen to match their enum values, `holiday_premium` (flow 09) does not.
- assertVisible:
    id: 'hours-earnings-breakdown-line-overtime-1'
- assertVisible:
    id: 'hours-earnings-breakdown-line-doubletime'
- assertVisible:
    id: 'hours-earnings-breakdown-line-regular-0'
- assertVisible:
    id: 'hours-earnings-breakdown-total'
- takeScreenshot: ca-overtime-week-breakdown
