# [audit-2026-08-17] Target A — the nanny works for two families at once, and
# nothing about ONE family's context (active household, Today card, inbox
# item, terms proposal, Hours deep link, pending schedule) may bleed the
# wrong family's name/data into the other's screen.
#
# Fixtures — scripts/seed-two-family-fixtures.ts (run it right before this
# flow, and with --clean right after: its rows change the nanny's Today and
# Inbox for every other flow). It deletes its previous rows and seeds, all in
# household B = LEAKCANARY the Cole household, for nanny@:
#   - a RUNNING time_entry (clocked in, no clock-out) while household A
#     (PHASE4_HOUSEHOLD_ID, "Our household") stays her ACTIVE household (A1);
#   - a `pending` schedule_pattern, Mon/Wed 08:00-13:00 (A2/A5);
#   - a `proposed` terms_proposal, direction='parent' — the OTHER family
#     proposing to the nanny (A2/A3).
# It prints TWO_FAMILY_PATTERN_ID / TWO_FAMILY_PROPOSAL_ID; put them in
# apps/mobile/.env.maestro. Requires seed-second-household.ts (launch-pass chain).
#
# ${PHASE4_HOUSEHOLD_ID} = household A, ${LEAKCANARY_HOUSEHOLD_ID} = household B.
appId: com.jetto.steadily.nanny
tags:
  - audit-2026-08-17
---
- runFlow: ../flows/login-nanny.yaml

# === A1: family B's running clock is named while A is active =============
# The cross-family surface is CrossFamilyStrip (P5 A2), pinned above Today's
# header: it names the OTHER family whose clock is running. The ClockInCard
# is scoped to the active household (A) and is legitimately absent here — A has
# no agreed terms for this nanny (flow 07 needs none), so the terms gate
# replaces it (flow 19).
- tapOn:
    id: 'tab-today'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'cross-family-strip-line'
    timeout: 15000
- assertVisible:
    id: 'cross-family-strip-line'
    text: 'LEAKCANARY the Cole household · still clocked in since .*'
- assertVisible:
    id: 'cross-family-strip-switch'
- takeScreenshot: 22-a1-strip-names-family-b

# === A2: inbox items from both families, each in its own zone =============
- openLink: steadilynanny:///inbox
- waitForAnimationToEnd
- assertVisible:
    id: 'inbox-screen'
- assertVisible:
    id: 'inbox-item-terms_proposal-${TWO_FAMILY_PROPOSAL_ID}'
- assertVisible:
    id: 'inbox-item-pending_pattern-${TWO_FAMILY_PATTERN_ID}'
- takeScreenshot: 22-a2-inbox-both-families

# === A3: family B's proposal, opened via inbox, names family B ============
- tapOn:
    id: 'inbox-item-terms_proposal-${TWO_FAMILY_PROPOSAL_ID}'
- waitForAnimationToEnd
- assertVisible:
    id: 'proposal-review-screen'
- assertVisible:
    text: 'Terms from LEAKCANARY the Cole household'
- assertNotVisible:
    text: '.*Our household.*'
- takeScreenshot: 22-a3-proposal-review-names-family-b
- tapOn:
    id: 'proposal-back'
- waitForAnimationToEnd

# === A4: Hours deep link with householdId=B switches to B's week ==========
- openLink: steadilynanny:///(private)/(tabs)/hours?householdId=${LEAKCANARY_HOUSEHOLD_ID}&weekStart=2026-08-17
- waitForAnimationToEnd
- assertVisible:
    id: 'hours-screen'
- assertVisible:
    id: 'hours-active-week-2026-08-17'
- takeScreenshot: 22-a4-hours-deeplink-family-b

# === A5: PendingScheduleCard shows B's pending week while A is active =====
- runFlow:
    file: ../flows/select-household.yaml
    env:
      HOUSEHOLD_ID: ${PHASE4_HOUSEHOLD_ID}
- tapOn:
    id: 'tab-today'
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'today-pending-schedule-card-${TWO_FAMILY_PATTERN_ID}'
    direction: DOWN
    timeout: 20000
    # The card lands late (inbox fan-out + per-pattern detail), below the
    # fold, under a sticky cross-family strip. At speed 40 only two fling
    # swipes fit in 10s and the hierarchy is read mid-momentum, so the card
    # was never seen 100% visible (2026-11-23: failure screenshot shows it
    # on screen). Slow no-fling swipe + centering, as in flow 21.
    speed: 10
    centerElement: true
- assertVisible:
    id: 'today-pending-schedule-card-${TWO_FAMILY_PATTERN_ID}'
- takeScreenshot: 22-a5-pending-schedule-other-family
