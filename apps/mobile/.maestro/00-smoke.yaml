# Smoke flow — launches the app and asserts the (unauthenticated) welcome
# screen is visible. No login, no fixtures — the fastest possible signal that
# the app boots.
#
# NOTE: apps/mobile/src/app/welcome.tsx has no testID on any of its elements
# (verified by reading the source directly), so this falls back to the
# visible welcome:title text ("Welcome to Steadily Nanny", see
# apps/mobile/src/i18n/locales/en/welcome.json) instead of the id selector
# docs/09-TESTING.md §7 prefers. Once a testID is added to that screen, swap
# this assertion to `assertVisible: { id: "<the-testid>" }`.
appId: com.jetto.steadily.nanny
---
- launchApp:
    clearState: false
- assertVisible: "Welcome to Steadily Nanny"
